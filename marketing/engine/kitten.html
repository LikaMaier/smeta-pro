<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>

  box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 0 0 3px #2c3442; padding: 12px; opacity: 0; }

</style></head><body><div id="stage">
<svg id="sv" viewBox="0 0 540 960" width="540" height="960">

  </defs>

  <!-- ============ СЦЕНА 1: котёнок на стройке ============ -->
  <g id="s1">
    <rect width="540" height="960" fill="url(#sky)"/>
    <circle id="sunC" cx="390" cy="520" r="230" fill="url(#sun)"/>
    <g id="rays" opacity="0"></g>
    <g id="far"></g>
    <g id="fogBack" opacity=".55"></g>

    <path d="M-40 760 Q140 720 300 745 Q430 765 600 735 L600 1000 L-40 1000Z" fill="url(#ground)"/>
    <g id="rubble"></g>

      <g id="kitten"></g>

<div id="dim" style="position:absolute;inset:0;background:rgba(5,10,20,.6);opacity:0"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const E = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const R = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const st = { stroke: '#2a1a12', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };

// ---------------- таймлайн ----------------
const T = { s1: [0, 6.4], phone: [6.4, 13.2], win: [13.2, 16.6], s3: [16.6, 22.6], end: [22.6, 25.5] };
window.DUR = 25.5;

// ---------------- фон стройки ----------------
(function buildSite() {
  const far = $('far');
  // дальний город и краны
  for (let i = 0; i < 12; i++) { const w = 30 + R(i) * 40, h = 80 + R(i + 9) * 170, x = i * 48 - 10; E('rect', { x, y: 640 - h, width: w, height: h, fill: '#4a2d55', opacity: .7 }, far); }
  const crane = (x, y, s, c) => { const g = E('g', { transform: `translate(${x},${y}) scale(${s})`, opacity: .85 }, far);
    E('path', { d: 'M0 0 L0 -330 M14 0 L14 -330', stroke: c, 'stroke-width': 5 }, g);
    for (let k = 0; k < 11; k++) E('path', { d: `M0 ${-k * 30} L14 ${-k * 30 - 30}`, stroke: c, 'stroke-width': 3 }, g);
    E('path', { d: 'M-120 -330 L220 -330 M-120 -318 L220 -318', stroke: c, 'stroke-width': 6 }, g);
    E('path', { d: 'M7 -330 L7 -380 M7 -380 L-120 -330 M7 -380 L220 -330', stroke: c, 'stroke-width': 3 }, g);
    E('path', { d: 'M160 -318 L160 -230', stroke: c, 'stroke-width': 2 }, g); E('rect', { x: 146, y: -230, width: 28, height: 18, fill: c }, g); };
  crane(90, 660, .9, '#3a2244'); crane(420, 690, .7, '#4a2d55');
  const mid = $('mid');
  // каркас недостроя (средний план)
  const g = E('g', { opacity: .95 }, mid);
  for (let f = 0; f < 5; f++) E('rect', { x: 300, y: 470 + f * 60, width: 230, height: 10, fill: '#2b1b2e' }, g);
  for (let c = 0; c < 5; c++) E('rect', { x: 300 + c * 55, y: 470, width: 10, height: 290, fill: '#2b1b2e' }, g);
  for (let c = 0; c < 4; c++) E('path', { d: `M${308 + c * 55} 470 L${320 + c * 55} 430`, stroke: '#2b1b2e', 'stroke-width': 3 }, g);
  const rub = $('rubble');
  for (let i = 0; i < 26; i++) { const x = R(i * 3) * 560 - 10, y = 765 + R(i * 5) * 170, s = 6 + R(i * 7) * 16; E('path', { d: `M${x} ${y} l${s} ${-s * .6} l${s * .9} ${s * .4} l${-s * .3} ${s * .5}Z`, fill: R(i) > .5 ? '#3a2621' : '#4d3229' }, rub); }
  for (let i = 0; i < 5; i++) { const x = 30 + i * 36; E('path', { d: `M${x} 800 L${x + 8} ${730 - R(i) * 30}`, stroke: '#2a1a18', 'stroke-width': 4 }, rub); } // арматура
  for (const id of ['fogBack', 'fogFront']) for (let i = 0; i < 7; i++) E('ellipse', { cx: R(i * 11 + id.length) * 600, cy: (id === 'fogBack' ? 640 : 820) + R(i * 13) * 80, rx: 160 + R(i) * 120, ry: 40 + R(i * 3) * 30, fill: '#ffe2c4', opacity: .35, filter: 'url(#fogb)', class: 'fog', 'data-i': i }, $(id));
  for (let i = 0; i < 70; i++) E(R(i * 2) > .7 ? 'path' : 'circle', R(i * 2) > .7 ? { d: 'M0 0 q6 -4 12 0 q-6 4 -12 0Z', fill: '#c98a4a', class: 'wp', 'data-i': i } : { r: 1 + R(i) * 2.2, fill: '#fff1d6', class: 'wp', 'data-i': i }, $('wind'));
  for (let i = 0; i < 14; i++) E('path', { d: 'M0 0 L-40 -1000 L40 -1000Z', fill: '#fff4cf', opacity: .08, transform: `translate(390,520) rotate(${-90 + i * 13})` }, $('rays'));
})();

// ---------------- котёнок-прораб с мечом ----------------
const K = {};
(function buildKitten() {
  const k = $('kitten');
  E('ellipse', { cx: 0, cy: 4, rx: 95, ry: 16, fill: 'rgba(0,0,0,.35)', filter: 'url(#blur2)' }, k);
  K.tail = E('path', { d: '', fill: 'url(#fur)', ...st }, k);
  K.capeBack = E('path', { d: '', fill: '#b3202a', ...st }, k);
  // тело
  E('ellipse', { cx: 0, cy: -72, rx: 58, ry: 64, fill: 'url(#fur)', ...st }, k);
  E('ellipse', { cx: 0, cy: -60, rx: 34, ry: 44, fill: '#fff3e2' }, k);
  E('ellipse', { cx: -26, cy: -8, rx: 22, ry: 13, fill: '#ffcf94', ...st }, k);
  E('ellipse', { cx: 26, cy: -8, rx: 22, ry: 13, fill: '#ffcf94', ...st }, k);
  // меч на плече
  K.sword = E('g', {}, k);
  const sw = K.sword;
  E('path', { d: 'M-9 0 L-9 -420 L0 -452 L9 -420 L9 0Z', fill: 'url(#blade)', ...st, 'stroke-width': 2.5 }, sw);
  E('path', { d: 'M0 -440 L0 -10', stroke: '#9aa6b4', 'stroke-width': 2 }, sw);
  K.glint = E('rect', { x: -9, y: -440, width: 18, height: 60, fill: 'url(#glint)', opacity: .9 }, sw);
  E('rect', { x: -46, y: 0, width: 92, height: 14, rx: 6, fill: '#d4a537', ...st, 'stroke-width': 2.5 }, sw);
  E('rect', { x: -8, y: 14, width: 16, height: 54, rx: 4, fill: '#5b3a24', ...st, 'stroke-width': 2.5 }, sw);
  E('circle', { cx: 0, cy: 74, r: 10, fill: '#d4a537', ...st, 'stroke-width': 2.5 }, sw);
  // лапки на рукояти
  K.paws = E('g', {}, k);
  E('path', { d: 'M-34 -92 Q10 -86 66 -66', fill: 'none', stroke: '#2a1a12', 'stroke-width': 25, 'stroke-linecap': 'round' }, K.paws);
  E('path', { d: 'M-34 -92 Q10 -86 66 -66', fill: 'none', stroke: '#f0a057', 'stroke-width': 19, 'stroke-linecap': 'round' }, K.paws);
  E('path', { d: 'M30 -96 Q56 -86 76 -74', fill: 'none', stroke: '#2a1a12', 'stroke-width': 25, 'stroke-linecap': 'round' }, K.paws);
  E('path', { d: 'M30 -96 Q56 -86 76 -74', fill: 'none', stroke: '#f0a057', 'stroke-width': 19, 'stroke-linecap': 'round' }, K.paws);
  E('ellipse', { cx: 70, cy: -66, rx: 14, ry: 12, fill: '#ffcf94', ...st }, K.paws);
  E('ellipse', { cx: 80, cy: -78, rx: 14, ry: 12, fill: '#ffcf94', ...st }, K.paws);
  // телефон (появляется)
  K.phone = E('g', { opacity: 0 }, k);
  E('circle', { cx: 0, cy: -150, r: 120, fill: 'url(#glow)' }, K.phone);
  E('rect', { x: -22, y: -150, width: 44, height: 78, rx: 8, fill: '#0b0f16', ...st, 'stroke-width': 2.5 }, K.phone);
  E('rect', { x: -17, y: -144, width: 34, height: 64, rx: 4, fill: '#3a8ff0' }, K.phone);
  E('text', { x: 0, y: -106, 'text-anchor': 'middle', 'font-family': 'PTN', 'font-size': 11, fill: '#fff' }, K.phone).textContent = 'СМЕТА';
  E('ellipse', { cx: -18, cy: -104, rx: 12, ry: 10, fill: '#ffcf94', ...st }, K.phone);
  E('ellipse', { cx: 18, cy: -104, rx: 12, ry: 10, fill: '#ffcf94', ...st }, K.phone);
  K.capeFront = E('path', { d: '', fill: '#d6303b', ...st }, k);
  // голова
  K.head = E('g', {}, k);
  const h = K.head;
  E('path', { d: 'M-66 -190 L-74 -262 L-22 -226Z', fill: 'url(#fur)', ...st }, h);
  E('path', { d: 'M66 -190 L74 -262 L22 -226Z', fill: 'url(#fur)', ...st }, h);
  E('path', { d: 'M-60 -200 L-64 -244 L-34 -224Z M60 -200 L64 -244 L34 -224Z', fill: '#ff9db0' }, h);
  E('path', { d: 'M-84 -166 Q-92 -138 -70 -122 Q-74 -112 -52 -104 Q0 -86 52 -104 Q74 -112 70 -122 Q92 -138 84 -166 Q86 -232 0 -238 Q-86 -232 -84 -166Z', fill: 'url(#fur)', ...st }, h);
  for (const [x, w] of [[-14, 6], [0, 7], [14, 6]]) E('path', { d: `M${x} -236 Q${x} -222 ${x * .8} -212`, stroke: '#c9773a', 'stroke-width': w, 'stroke-linecap': 'round', fill: 'none' }, h);
  E('ellipse', { cx: 0, cy: -126, rx: 40, ry: 26, fill: '#fff3e2' }, h);
  K.eyes = E('g', {}, h);
  for (const s of [-1, 1]) {
    const g = E('g', { class: 'eye', 'data-s': s }, K.eyes);
    E('ellipse', { cx: s * 34, cy: -160, rx: 23, ry: 27, fill: 'url(#eye)', ...st, 'stroke-width': 2.5 }, g);
    E('ellipse', { cx: s * 34 - 7, cy: -170, rx: 8, ry: 9, fill: '#fff' }, g);
    E('circle', { cx: s * 34 + 8, cy: -150, r: 4, fill: '#fff', opacity: .9 }, g);
  }
  K.lids = [-1, 1].map((s) => E('ellipse', { cx: s * 34, cy: -160, rx: 26, ry: 0, fill: '#f0a057', ...st, 'stroke-width': 2.5 }, h));
  E('path', { d: 'M-7 -132 L7 -132 L0 -124Z', fill: '#ff7f99', ...st, 'stroke-width': 2 }, h);
  K.mouth = E('path', { d: 'M-12 -118 Q-6 -110 0 -118 Q6 -110 12 -118', fill: 'none', ...st, 'stroke-width': 2.5 }, h);
  for (const s of [-1, 1]) for (const dy of [-6, 4]) E('path', { d: `M${s * 30} ${-124 + dy} L${s * 82} ${-130 + dy * 2}`, stroke: '#fff', 'stroke-width': 2, opacity: .85 }, h);
  E('ellipse', { cx: -52, cy: -128, rx: 11, ry: 7, fill: '#ff8fa3', opacity: .55 }, h); E('ellipse', { cx: 52, cy: -128, rx: 11, ry: 7, fill: '#ff8fa3', opacity: .55 }, h);
  // каска
  const hat = E('g', { transform: 'rotate(-8 0 -226)' }, h);
  E('path', { d: 'M-58 -220 Q-56 -282 0 -286 Q56 -282 58 -220Z', fill: '#ffb000', ...st }, hat);
  E('rect', { x: -72, y: -226, width: 144, height: 14, rx: 7, fill: '#ffb000', ...st }, hat);
  E('path', { d: 'M-8 -284 L-8 -224 M8 -284 L8 -224', stroke: '#e09a00', 'stroke-width': 6 }, hat);
  E('path', { d: 'M-40 -262 Q-30 -276 -14 -278', stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', opacity: .7 }, hat);
})();

// ---------------- тигр в бассейне и собачка ----------------
const TG = {};
(function buildTiger() {
  for (let i = 0; i < 16; i++) { const x = i * 36 + 6, y = 150 + Math.sin(i * .7) * 26 + i * 4; E('circle', { cx: x, cy: y, r: 5, fill: '#ffe08a', class: 'bulb', 'data-i': i }, $('lights')); }
  E('path', { d: 'M0 150 Q100 190 200 170 Q330 145 540 230', fill: 'none', stroke: '#111827', 'stroke-width': 2 }, $('lights'));
  for (let i = 0; i < 20; i++) E('rect', { x: i * 28, y: 520, width: 20, height: 120, rx: 4, fill: '#7a5a3a', opacity: .8 }, $('fence'));
  E('rect', { x: 0, y: 550, width: 540, height: 10, fill: '#6a4a2e' }, $('fence')); E('rect', { x: 0, y: 600, width: 540, height: 10, fill: '#6a4a2e' }, $('fence'));
  for (let i = 0; i < 8; i++) E('circle', { cx: R(i) * 540, cy: 640 + R(i * 3) * 20, r: 40 + R(i * 5) * 30, fill: '#244d30' }, $('fence'));
  const s = $('tigerScene');
  // бассейн
  E('ellipse', { cx: 300, cy: 850, rx: 210, ry: 40, fill: 'rgba(0,0,0,.35)', filter: 'url(#blur6)' }, s);
  E('path', { d: 'M100 700 L100 830 Q300 880 500 830 L500 700Z', fill: '#2f7fcf', ...st }, s);
  for (let i = 0; i < 9; i++) E('path', { d: `M${120 + i * 44} 712 L${120 + i * 44} ${838 + Math.sin(i) * 4}`, stroke: '#2669ad', 'stroke-width': 3 }, s);
  TG.water = E('ellipse', { cx: 300, cy: 700, rx: 200, ry: 34, fill: 'url(#water)', ...st }, s);
  // тигр
  const t = E('g', {}, s); TG.g = t;
  E('path', { d: 'M196 700 Q190 600 300 590 Q410 600 404 700Z', fill: 'url(#tig)', ...st }, t); // плечи в воде
  for (const x of [230, 270, 330, 370]) E('path', { d: `M${x} 610 Q${x + 10} 650 ${x - 4} 700`, stroke: '#2a1a12', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, t);
  E('ellipse', { cx: 300, cy: 690, rx: 200, ry: 22, fill: '#6fd0ff', opacity: .55 }, t); // вода перед телом
  TG.head = E('g', {}, t);
  const h = TG.head;
  E('circle', { cx: 240, cy: 470, r: 26, fill: '#f7a541', ...st }, h); E('circle', { cx: 360, cy: 470, r: 26, fill: '#f7a541', ...st }, h);
  E('circle', { cx: 240, cy: 472, r: 12, fill: '#2a1a12' }, h); E('circle', { cx: 360, cy: 472, r: 12, fill: '#2a1a12' }, h);
  E('path', { d: 'M210 540 Q206 460 300 452 Q394 460 390 540 Q392 600 300 612 Q208 600 210 540Z', fill: 'url(#tig)', ...st }, h);
  for (const [d] of [['M300 456 L300 490'], ['M280 460 L286 486'], ['M320 460 L314 486'], ['M214 520 L246 528'], ['M216 548 L246 548'], ['M386 520 L354 528'], ['M384 548 L354 548']]) E('path', { d, stroke: '#2a1a12', 'stroke-width': 6, 'stroke-linecap': 'round' }, h);
  E('path', { d: 'M248 560 Q300 540 352 560 Q356 604 300 610 Q244 604 248 560Z', fill: '#fff4e6' }, h);
