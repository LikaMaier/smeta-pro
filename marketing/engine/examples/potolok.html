<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Потолок 20 м² — сравнение 3D</title>
<style>
#cv { position: absolute; inset: 0; }
#fx { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
#hook { top: 290px !important; font-size: 44px !important; }
#price { position: absolute; left: 0; right: 0; top: 70px; z-index: 20; text-align: center; font-family: 'PTN'; font-size: 92px; line-height: 1; color: #FFD43B; -webkit-text-stroke: 7px #1b0f05; paint-order: stroke fill; opacity: 0; }
#name { position: absolute; left: 0; right: 0; top: 170px; z-index: 20; text-align: center; font-family: 'PT', 'Noto Color Emoji'; font-size: 36px; color: #fff; -webkit-text-stroke: 6px #000; paint-order: stroke fill; opacity: 0; }
#card { position: absolute; left: 22px; right: 22px; top: 735px; z-index: 20; background: rgba(255,255,255,.97); border-radius: 22px; padding: 14px 18px; box-shadow: 0 14px 34px rgba(0,0,0,.35); opacity: 0; border-left: 10px solid #FFD43B; }
#card .p { font-family: 'PT', 'Noto Color Emoji'; font-size: 25px; color: #11643a; line-height: 1.15; }
#card .m { font-family: 'PT', 'Noto Color Emoji'; font-size: 25px; color: #a1121f; line-height: 1.15; margin-top: 4px; }
#bars { position: absolute; left: 22px; right: 22px; top: 250px; z-index: 22; display: flex; flex-direction: column; gap: 9px; opacity: 0; }
.bar { position: relative; height: 54px; border-radius: 14px; background: rgba(0,0,0,.55); overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 14px; background: linear-gradient(90deg, #e0a050, #FFD43B); }
.bar span { position: absolute; left: 14px; right: 14px; top: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; font-family: 'PT', 'Noto Color Emoji'; font-size: 24px; color: #fff; -webkit-text-stroke: 4px #000; paint-order: stroke fill; }
#share { position: absolute; left: 20px; right: 20px; top: 660px; z-index: 22; text-align: center; font-family: 'PT', 'Noto Color Emoji'; font-size: 38px; line-height: 1.12; color: #fff; -webkit-text-stroke: 7px #000; paint-order: stroke fill; opacity: 0; }
#share b { color: #FFD43B; }
#note { position: absolute; left: 0; right: 0; bottom: 56px; z-index: 23; text-align: center; font-family: 'PTR'; font-size: 17px; color: rgba(255,255,255,.9); opacity: 0; }
#dim { position: absolute; inset: 0; background: #0b0d14; opacity: 0; z-index: 21; }
</style></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="price"></div>
<div id="name"></div>
<div id="card"><div class="p"></div><div class="m"></div></div>
<div id="dim"></div>
<div id="bars"></div>
<div id="share">📩 Отправь тому, кто <b>выбирает потолок</b><br>👇 А у вас какой?</div>
<div id="note">комната 20 м² · работа + материалы · ориентир СПб, октябрь 2026 · расчёт в СМЕТА PRO</div>
<div id="hook" class="cap"></div>
<div id="fade"></div>
<div id="end"><div class="ic">💡</div><div class="logo">СМЕТА PRO</div><div class="l2">Посчитайте свой потолок<br><span style="color:#FFD43B">за 2 минуты в Telegram</span></div><div class="bot">@CMETA_Pro_bot</div><div class="sm">День бесплатно + 12 дней за подписку на Instagram</div></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script>
window.DUR = 24;
const T0 = 2.0, DT = 2.7;
const C = [
  ['stretch', '✨ Натяжной', 22300, '+ за 1 день, держит потоп от соседей', '− боится острых предметов'],
  ['paint', '🎨 Покраска', 33690, '+ классика, без «плёнки»', '− нужен идеально ровный потолок'],
  ['wood', '🪵 Дерево (рейки)', 43300, '+ тепло и уютно, хорошо гасит эхо', '− темнеет без лака, боится влаги'],
  ['rack', '🔩 Реечный', 62700, '+ для ванной: не боится пара', '− выглядит «по-офисному»'],
  ['gkl', '📐 ГКЛ в 1 уровень', 79350, '+ прячет провода, трубы и неровности', '− съедает 5–10 см высоты'],
  ['gkl2', '🏰 ГКЛ в 2 уровня', 96410, '+ зонирование, ниша для штор и подсветки', '− дороже всех и дольше'],
];
const BARS = T0 + C.length * DT, END = BARS + 3.2;
const S = new M3.Scene($('cv'));
const FX = $('fx').getContext('2d');
const fmt = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ');
const H = 2.7, X0 = -2.5, X1 = 2.5, Z0 = -2, Z1 = 2;
function room() {
  S.box(X0 - .2, X1 + .2, -.25, 0, Z0 - .2, Z1 + .2, '#8d8a85', { top: '#c79a66' });
  for (let x = X0 + .4; x < X1; x += .4) S.line([[x, .003, Z0], [x, .003, Z1]], { color: 'rgba(90,55,25,.35)', w: 1 });
  S.box(X0 - .2, X0, 0, H + .3, Z0 - .2, Z1 + .2, '#ece6dc', { side: '#efe9df' });
  S.box(X0 - .2, X1 + .2, 0, H + .3, Z0 - .2, Z0, '#e7e0d4', { front: '#ebe4d8' });
  S.box(-1.4, .6, 0, .45, -1.95, -1.1, '#5f7aa3', { shadow: true }); S.box(-1.4, .6, .45, .95, -1.95, -1.75, '#6d88b2', {});
  S.box(-2.45, -2.4, .9, 2.0, -.8, .8, '#6aa2c8', { emit: true }); // окно-картина
  S.cyl('y', [1.6, .3, -1.4], .25, .6, '#b9764a', { seg: 10 }); S.cone([1.6, .6, -1.4], .5, 1.3, '#3f8f55', { seg: 9 });
}
function ceiling(kind, k, t) {
  const y = H + (1 - eOut(k)) * 1.6, al = clamp(k * 2);
  const o = { alpha: al };
  if (kind === 'stretch') { S.box(X0, X1, y - .02, y, Z0, Z1, '#f8f8fb', { ...o, bias: -.5 }); for (let i = 0; i < 6; i++) S.cyl('y', [-1.6 + (i % 3) * 1.6, y - .03, -1 + Math.floor(i / 3) * 2], .09, .02, '#fff6dc', { seg: 10, emit: true }); }
  if (kind === 'paint') S.box(X0, X1, y - .02, y, Z0, Z1, '#f3f1ec', o);
  if (kind === 'wood') { S.box(X0, X1, y - .01, y, Z0, Z1, '#5b4230', o); for (let x = X0 + .06; x < X1; x += .16) S.box(x, x + .1, y - .1, y - .01, Z0, Z1, '#b98656', o); }
  if (kind === 'rack') { for (let z = Z0 + .05; z < Z1; z += .2) S.box(X0, X1, y - .06, y - .02, z, z + .15, '#d9dde2', o); }
  if (kind === 'gkl') { S.box(X0, X1, y - .14, y - .02, Z0, Z1, '#f5f4f0', o); for (let i = 0; i < 4; i++) S.cyl('y', [-1.2 + (i % 2) * 2.4, y - .15, -.8 + Math.floor(i / 2) * 1.6], .08, .02, '#fff4cf', { seg: 10, emit: true }); }
  if (kind === 'gkl2') { S.box(X0, X1, y - .1, y - .02, Z0, Z1, '#f5f4f0', o); S.box(X0, X1, y - .45, y - .1, Z0, Z0 + .7, '#f2f1ec', o); S.box(X0, X0 + .7, y - .45, y - .1, Z0, Z1, '#f2f1ec', o); S.box(X0 + .7, X1, y - .47, y - .44, Z0 + .7, Z0 + .74, '#ffe08a', { emit: true }); S.box(X0 + .7, X0 + .74, y - .47, y - .44, Z0 + .7, Z1, '#ffe08a', { emit: true }); }
}
window.render = function (t) {
  let ci = -1; for (let i = 0; i < C.length; i++) if (t >= T0 + i * DT) ci = i;
  const yaw = .55 + Math.sin(t * .35) * .2, pitch = -.26 + Math.sin(t * .5) * .04, dist = 9.5 - 1.5 * eOut(t / 2);
  S.camera([0, 2.5, -.3], yaw, pitch, dist, 44);
  const x = S.ctx; x.setTransform(2, 0, 0, 2, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, 960); g.addColorStop(0, '#20283a'); g.addColorStop(1, '#3d4a63'); x.fillStyle = g; x.fillRect(0, 0, 540, 960);
  S.fogColor = [40, 50, 70]; S.fog = [30, 80]; S.L = M3.norm([.3, .9, .55]); S.amb = .74; S.dif = .4; S.ao = .3; S.aoH = 1.2; S.shadowA = .25;
  room();
  // в крючке — потолки сменяются быстро
  if (ci < 0) ceiling(C[Math.floor(t * 3) % C.length][0], 1, t);
  else { const k = (t - T0 - ci * DT) / .7; ceiling(C[ci][0], clamp(k), t); if (k < 1 && ci > 0) ceiling(C[ci - 1][0], 1 - clamp(k * 2), t); }
  S.render();
  FX.setTransform(2, 0, 0, 2, 0, 0); FX.clearRect(0, 0, 540, 960);
  PFX.apply(x, t, { bloom: .2, vignette: .4 });
  $('hook').innerHTML = 'Потолок 20 м²:<br><b>от 22 до 96 тыс ₽</b> 😳<br>Какой выбрать?';
  $('hook').style.opacity = win(t, 0, T0 - .05, .01, .2);
  $('hook').style.transform = `scale(${1.05 + Math.sin(t * 8) * .025 - eOut(t / .3) * .05})`;
  const show = ci >= 0 && t < BARS;
  if (show) {
    const [, n, p, plus, minus] = C[ci], ct = T0 + ci * DT;
    $('price').textContent = `${fmt(lerp(ci ? C[ci - 1][2] : 0, p, eOut((t - ct) / .8)))} ₽`; $('name').textContent = n;
    const cd = $('card'); if (cd._i !== ci) { cd._i = ci; cd.querySelector('.p').textContent = plus; cd.querySelector('.m').textContent = minus; }
    cd.style.opacity = clamp((t - ct - .5) / .2); cd.style.transform = `translateY(${(1 - eOut((t - ct - .5) / .3)) * 30}px)`;
    $('price').style.transform = `scale(${1 + (t - ct < .3 ? Math.sin((t - ct) / .3 * Math.PI) * .12 : 0)})`;
    $('name').style.transform = `translateX(${(1 - eOut((t - ct) / .3)) * 40}px)`;
  } else $('card').style.opacity = 0;
  $('price').style.opacity = show ? 1 : 0; $('name').style.opacity = show ? 1 : 0;
  const bars = $('bars'); if (!bars.children.length) C.forEach(([, n, p]) => bars.insertAdjacentHTML('beforeend', `<div class="bar"><i></i><span><b>${n}</b><em>${Math.round(p / 1000)} тыс ₽</em></span></div>`));
  bars.style.opacity = win(t, BARS, END + .1, .2, .2);
  [...bars.children].forEach((b, i) => { b.firstElementChild.style.width = `${eOut((t - BARS - i * .15) / .5) * C[i][2] / C[5][2] * 100}%`; });
  $('dim').style.opacity = win(t, BARS, END + .1, .3, .2) * .6;
  $('share').style.opacity = win(t, BARS + 1.2, END + .1, .2, .2);
  $('note').style.opacity = win(t, T0, END, .2, .2);
  $('fade').style.opacity = 0;
  renderEnd(t, END);
};
readyWith([]);
</script>
</body></html>
