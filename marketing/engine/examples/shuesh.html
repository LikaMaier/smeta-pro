<script>

  // голый бетон выше, трещины, розетка
  E('path', { d: 'M60 300 l20 30 l-10 20 l26 34', stroke: '#4b4250', 'stroke-width': 2, fill: 'none' }, w);
  E('rect', { x: 440, y: 330, width: 34, height: 34, rx: 5, fill: '#e8e3dc', ...st, 'stroke-width': 2 }, w);

  E('path', { d: 'M-56 770 Q-14 720 28 770', fill: 'none', stroke: '#22181a', 'stroke-width': 3 }, p);
  E('path', { d: 'M250 760 Q248 712 276 708 L326 708 Q348 712 344 760Z', fill: '#c8b48c', ...st }, p);

})();

// ---------------- медведь-прораб ----------------
const B = {};
(function buildBear() {
  const g = $('bear'); g.setAttribute('transform', 'translate(130,870) scale(1.25)');
  E('ellipse', { cx: 0, cy: 4, rx: 100, ry: 16, fill: 'rgba(0,0,0,.3)', filter: 'url(#blur2)' }, g);

  E('ellipse', { cx: 0, cy: -110, rx: 80, ry: 100, fill: 'url(#bearG)', ...st }, g);
  // жилет

  // вторая рука с телефоном

  E('path', { d: 'M-62 -150 Q-108 -110 -84 -84', fill: 'none', stroke: '#7a4a26', 'stroke-width': 30, 'stroke-linecap': 'round' }, B.arm2);

  E('circle', { cx: -50, cy: -262, r: 11, fill: '#d29a6a' }, h); E('circle', { cx: 50, cy: -262, r: 11, fill: '#d29a6a' }, h);
  E('ellipse', { cx: 0, cy: -222, rx: 70, ry: 62, fill: 'url(#bearG)', ...st }, h);
  E('ellipse', { cx: 0, cy: -198, rx: 34, ry: 26, fill: '#e2b487', ...st, 'stroke-width': 2 }, h);
  E('ellipse', { cx: 0, cy: -212, rx: 13, ry: 9, fill: '#22181a' }, h);
  E('path', { d: 'M-12 -190 Q0 -180 12 -190', fill: 'none', stroke: '#22181a', 'stroke-width': 3, 'stroke-linecap': 'round' }, h);
  B.eyes = [-26, 26].map((x) => E('ellipse', { cx: x, cy: -236, rx: 7, ry: 8, fill: '#160f10' }, h));
  B.lids = [-26, 26].map((x) => E('path', { d: `M${x - 11} -247 L${x + 11} -247 L${x + 11} -238 L${x - 11} -238Z`, fill: '#8a5530', opacity: 0 }, h));
  // каска
  E('path', { d: 'M-66 -250 Q-64 -318 0 -322 Q64 -318 66 -250Z', fill: 'url(#helm)', ...st }, h);
  E('path', { d: 'M-84 -250 L84 -250 Q86 -238 72 -238 L-72 -238 Q-86 -238 -84 -250Z', fill: '#f29a00', ...st }, h);
  E('path', { d: 'M-10 -320 L-10 -252 M10 -320 L10 -252', stroke: '#e08600', 'stroke-width': 4 }, h);
})();

// ---------------- енот-заказчик ----------------
const N = {};
(function buildEnot() {
  const g = $('enot');
  E('ellipse', { cx: 0, cy: 4, rx: 90, ry: 14, fill: 'rgba(0,0,0,.3)', filter: 'url(#blur2)' }, g);
  N.tail = E('g', {}, g);
  E('path', { d: 'M50 -40 Q130 -50 150 -140 Q156 -170 132 -176 Q112 -120 46 -76Z', fill: '#8b8e99', ...st }, N.tail);
  for (const [a, b] of [[60, -62], [92, -84], [118, -116], [136, -150]]) E('path', { d: `M${a - 8} ${b + 10} L${a + 12} ${b - 12}`, stroke: '#2b2a30', 'stroke-width': 12, 'stroke-linecap': 'round' }, N.tail);
  E('ellipse', { cx: -30, cy: -8, rx: 26, ry: 14, fill: '#2b2a30', ...st }, g); E('ellipse', { cx: 30, cy: -8, rx: 26, ry: 14, fill: '#2b2a30', ...st }, g);
  E('ellipse', { cx: 0, cy: -100, rx: 68, ry: 90, fill: 'url(#furG)', ...st }, g);
  // пиджак и галстук
  E('path', { d: 'M-64 -140 Q-74 -60 -50 -24 L50 -24 Q74 -60 64 -140 Q36 -172 0 -172 Q-36 -172 -64 -140Z', fill: '#3d5a8c', ...st }, g);
  E('path', { d: 'M-24 -170 L0 -120 L24 -170Z', fill: '#f4f1ea', ...st, 'stroke-width': 2 }, g);
  E('path', { d: 'M0 -150 L-9 -136 L0 -80 L9 -136Z', fill: '#d6303b', ...st, 'stroke-width': 2 }, g);
  // папка
  N.arm = E('g', {}, g);
  E('rect', { x: -92, y: -126, width: 60, height: 82, rx: 4, fill: '#f0c445', ...st, transform: 'rotate(-8 -66 -85)' }, N.arm);
  E('path', { d: 'M-60 -140 Q-92 -110 -70 -84', fill: 'none', stroke: '#3d5a8c', 'stroke-width': 26, 'stroke-linecap': 'round' }, N.arm);
  E('circle', { cx: -70, cy: -84, r: 13, fill: '#2b2a30' }, N.arm);
  // голова
  N.head = E('g', {}, g);
  const h = N.head;
  E('path', { d: 'M-62 -230 L-58 -290 L-22 -262Z', fill: '#8b8e99', ...st }, h); E('path', { d: 'M62 -230 L58 -290 L22 -262Z', fill: '#8b8e99', ...st }, h);
  E('path', { d: 'M-52 -244 L-52 -276 L-34 -258Z M52 -244 L52 -276 L34 -258Z', fill: '#e9d9cf' }, h);
  E('ellipse', { cx: 0, cy: -215, rx: 72, ry: 58, fill: 'url(#furG)', ...st }, h);
  E('path', { d: 'M-70 -214 Q-40 -248 0 -226 Q40 -248 70 -214 Q50 -194 26 -206 Q0 -196 -26 -206 Q-50 -194 -70 -214Z', fill: '#2b2a30' }, h);
  E('path', { d: 'M-30 -258 Q0 -268 30 -258 Q0 -246 -30 -258Z', fill: '#efe9e1' }, h);
  E('ellipse', { cx: 0, cy: -184, rx: 34, ry: 22, fill: '#efe9e1', ...st, 'stroke-width': 2 }, h);
  E('ellipse', { cx: 0, cy: -196, rx: 10, ry: 7, fill: '#22181a' }, h);
  N.mouth = E('path', { d: '', fill: '#5a1f2a', stroke: '#22181a', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, h);
  N.eyeW = [-30, 30].map((x) => E('circle', { cx: x, cy: -220, r: 13, fill: '#fff', ...st, 'stroke-width': 2 }, h));
  N.pup = [-30, 30].map((x) => E('circle', { cx: x, cy: -220, r: 6, fill: '#111' }, h));
  N.brow = [-30, 30].map((x) => E('path', { d: '', stroke: '#22181a', 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none' }, h));
})();

// ---------------- подписи ----------------
const CAPS = [
  [0.0, 2.2, 'Заказчик: «Смета нужна<br><span class="y">к утру.</span> С материалами»', ''],
  [2.2, 3.9, 'Заказчик: «Смета нужна<br><span class="y">к утру.</span> С материалами»', 'Я: «Через <span class="y">2 минуты</span><br>пришлю»'],
];
const SCREENS = [['1home', 'Новая смета', 153, 102], ['2dirs', 'Направление — плитка', 220, 166], ['3kinds', 'Санузел целиком', 122, 217],
  ['4form', 'Площадь — пара цифр', 190, 200], ['5result', 'Работы и материалы<br><span class="y">с ценами</span> — готово', 0, 0], ['8est', 'PDF заказчику —<br><span class="y">одной кнопкой</span>', 73, 141]];

function caption(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } el.style.opacity = html ? 1 : 0; }
function glitchText(el, on, t) {
  if (!on) { el.style.textShadow = ''; return; }
  const k = Math.floor(t * 20), dx = (R(k) - .5) * 12, dy = (R(k + 3) - .5) * 6;
  el.style.textShadow = `${dx}px ${dy}px 0 rgba(255,40,80,.9), ${-dx}px ${-dy}px 0 rgba(40,230,255,.9)`;
}

window.render = function (t) {
  const g1 = t >= G1[0] && t < G1[1], g2 = t >= G2[0] && t < G2[1];
  const gl = g1 || g2, gk = Math.floor(t * 15);
  const gAmt = gl ? (R(gk * 7) > .35 ? 1 : .3) : 0;
  // --- камера ---
  let cx = 270, cy = 480, s = 1;
  if (t < G1[0]) { s = lerp(1.0, 1.12, ease(t / 3.9)); cx = lerp(270, t < 2.2 ? 330 : 230, ease((t % 2.2) / 1.2)); }
  else if (t < T.phone[0]) { const k = eOut((t - G1[0]) / .25); s = lerp(1.12, 2.0, k); cx = lerp(230, 405, k); cy = lerp(480, 610, k); }
  else if (t < G2[0]) { s = lerp(1.05, 1.0, ease((t - T.win[0]) / 1.6)); }
  else { const k = eOut((t - G2[0]) / .3); s = lerp(1.0, 1.7, k); cx = lerp(270, 405, k); cy = lerp(480, 620, k); }
  const shx = gl ? (R(gk) - .5) * 14 * gAmt : 0, shy = gl ? (R(gk + 1) - .5) * 8 * gAmt : 0;
  $('cam').setAttribute('transform', `translate(${270 + shx},${480 + shy}) scale(${s}) translate(${-cx},${-cy - (s - 1) * 0})`);
  // --- енот ---
  const en = $('enWrap');
  en.setAttribute('transform', `translate(405,870) scale(1.25)`);
  N.tail.setAttribute('transform', `rotate(${Math.sin(t * 3) * 6} 50 -40)`);
  const talking = (t < 2.2 && Math.sin(t * 20) > 0);
  // голова: обычная / глитч (кручение, вытягивание)
