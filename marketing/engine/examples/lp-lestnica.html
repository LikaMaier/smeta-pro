<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Лестница и стремянка</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script src="lp-props.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('🪜', 'Ремонт без травм —', 'смета за 2 минуты в Telegram'));
window.DUR = 40;
const TB = 5.6, T1 = 9.2, T2 = 13.6, T3 = 18.2, T4 = 23, T5 = 27.8, T6 = 32.2, TE = 36;
const STEPS = [[T1, 'ПРАВИЛО 1', 'угол около 75°'], [T2, 'ПРАВИЛО 2', 'упоры внизу'], [T3, 'ПРАВИЛО 3', 'не на верхних ступенях'], [T4, 'ПРАВИЛО 4', 'перфоратор — с подмостей'], [T5, 'ПРАВИЛО 5', 'напарник держит']];
const SUBS = [
  [3.1, TB, '«Да тут невысоко,<br>с верхней ступеньки дотянусь»…'],
  [6.8, 9.0, 'Двух метров хватает,<br>чтобы <b>больничный стал отпуском</b>'],
  [T1 + .2, T2 - .1, 'Приставная лестница — <b>около 75°</b>:<br>низ отставлен на ¼ высоты'],
  [T2 + .2, T3 - .1, 'Внизу — <b>резиновые упоры</b>,<br>пол ровный и сухой'],
  [T3 + .2, T4 - .1, 'На <b>двух верхних ступенях</b><br>без перил не стоим'],
  [T4 + .2, T5 - .1, 'Перфоратор и болгарка — не с приставной<br>лестницы, а <b>с подмостей или вышки-туры</b>'],
  [T5 + .2, T6 - .1, 'Верх не закреплён —<br>лестницу <b>держит напарник</b>'],
  [T6 + .2, TE - .1, 'Лестница — не трамплин.<br>Стой ниже и <b>держись</b>'],
];
const CAM = [
  [0, 1.0, .12, 10, 0, 2.2, -1.2], [3, 1.25, .06, 8, 0, 2.4, -1.3], [TB, 1.3, .06, 8, 0, 2.2, -1.2], [9, 1.3, .06, 8, 0, 2.2, -1.2],
  [T1 + .6, 1.5, .04, 8, 0, 1.8, -1.4], [T2 - .2, 1.48, .04, 8, 0, 1.8, -1.4], [T2 + .6, 1.1, .3, 3.4, 0, .4, -1.1], [T3 - .2, 1.15, .3, 3.4, 0, .4, -1.1],
  [T3 + .6, 1.35, .06, 6.5, 0, 2.6, -1.6], [T4 - .2, 1.3, .06, 6.5, 0, 2.6, -1.6], [T4 + .6, .8, .1, 8, 1.6, 1.9, -1.2], [T5 - .2, .75, .1, 8, 1.6, 1.9, -1.2],
  [T5 + .6, 1.1, .08, 7.5, 0, 1.8, -1.2], [T6 - .2, 1.15, .08, 7.5, 0, 1.8, -1.2], [T6 + .8, .9, .14, 10, .6, 2.0, -1.2], [99, .95, .14, 10, .6, 2.0, -1.2],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
const WZ = -2, H = 3.0, WH = 4.4;
function room() {
  for (let x = -3; x < 4; x += 1) for (let z = -2.2; z < 2; z += 1) S.box(x, x + 1, -.15, 0, z, Math.min(2, z + 1), '#b08a64', { top: '#c9a47a', groundTop: true });
  for (let x = -3; x < 4; x += .5) for (let y = 0; y < WH; y += 1.1) S.box(x, x + .5, y, Math.min(WH, y + 1.1), -2.25, WZ, '#e8e2d8', { front: '#ece6dc' });
  S.box(-.5, .5, 3.7, 3.72, WZ, WZ + .02, '#495057', { bias: -.5 });
}
function ladder(d, slide = 0, x = 0) {
  const base = [x, 0, WZ + d + slide], topY = Math.sqrt(Math.max(.1, H * H + d * d - (d + slide) * (d + slide))) * (H / Math.hypot(H, d)) * Math.hypot(H, d) / H;
  const top = [x, Math.min(H, topY), WZ + .03];
  for (const dx of [-.22, .22]) LP.rod([x + dx, base[1], base[2]], [x + dx, top[1], top[2]], .03, '#adb5bd', { seg: 6 });
  const n = 9; for (let i = 1; i <= n; i++) { const k = i / (n + 1); const p = [x, lerp(base[1], top[1], k), lerp(base[2], top[2], k)]; LP.rod([x - .22, p[1], p[2]], [x + .22, p[1], p[2]], .022, '#adb5bd', { seg: 5 }); }
  return { base, top, step: (i) => { const k = i / (n + 1); return [x, lerp(base[1], top[1], k), lerp(base[2], top[2], k)]; } };
}
window.render = function (t) {
  LP.sky(); LP.cam(CAM, t);
  room();
  const bad = t < T1; let tb = t; if (bad && t > 7.8) tb = lerp(6.6, 4.0, ease((t - 7.8) / 1.2));
  if (bad) {
    const sl = tb > TB ? Math.min(.9, (tb - TB) * (tb - TB) * 1.6) : 0;
    const L = ladder(1.15, sl);
    const st = L.step(9);
    LP.person(0, st[1], st[2] + .1, Math.PI, tb, tb < TB ? 'drill' : 'up', { lean: -sl * .9, helmet: false, hair: '#5c4033' });
  } else if (t < T4) {
    const L = ladder(.75, 0);
    const i = t > T3 ? 5 : 7, st = L.step(i);
    LP.person(0, st[1], st[2] + .1, Math.PI, t, 'reach', { helmet: false, hair: '#5c4033' });
    if (t > T2) for (const dx of [-.22, .22]) S.box(dx - .05, dx + .05, 0, .06, L.base[2] - .06, L.base[2] + .06, '#212529', { bias: -1 });
    if (t > T3 + .4) { const a = S.proj(L.step(9)), b = S.proj(L.step(8)); FX.save(); FX.strokeStyle = '#e03131'; FX.lineWidth = 5; FX.beginPath(); FX.moveTo(a[0] - 30, a[1] - 10); FX.lineTo(b[0] + 30, b[1] + 10); FX.moveTo(a[0] + 30, a[1] - 10); FX.lineTo(b[0] - 30, b[1] + 10); FX.globalAlpha = win(t, T3 + .4, T4 - .1); FX.stroke(); FX.restore(); }
  } else if (t < T5) {
    // вышка-тура
    const x0 = .9, x1 = 2.3, z0 = -1.9, z1 = -1.0, y = 1.4;
    for (const x of [x0, x1]) for (const z of [z0, z1]) { S.box(x - .03, x + .03, .1, y + 1.0, z - .03, z + .03, '#adb5bd'); S.cyl('z', [x, .07, z], .07, .04, '#212529', { seg: 10 }); }
    for (const yy of [.4, y]) S.box(x0, x1, yy - .03, yy + .03, z0 - .03, z1 + .03, '#adb5bd');
    S.box(x0, x1, y, y + .05, z0, z1, '#c49a68'); for (const yy of [y + .5, y + 1.0]) { S.box(x0, x1, yy - .02, yy + .02, z1 - .02, z1 + .02, '#f2c230'); S.box(x0, x1, yy - .02, yy + .02, z0 - .02, z0 + .02, '#f2c230'); }
    LP.person(1.6, y + .05, -1.5, Math.PI, t, 'drill', { helmet: true, strap: true });
  } else {
    const L = ladder(.75, 0); const st = L.step(5);
    LP.person(0, st[1], st[2] + .1, Math.PI, t, 'reach', { helmet: false, hair: '#5c4033' });
    LP.person(.0, 0, L.base[2] + .55, Math.PI, t, 'reach', { shirt: '#4c9be0', helmet: false, hair: '#212529' });
  }
  S.render();
  if (t > T1 + .4 && t < T2) { const a = win(t, T1 + .4, T2 - .1), b0 = S.proj([0, 0, WZ]), b1 = S.proj([0, 0, WZ + .75]), h1 = S.proj([0, H, WZ]); FX.save(); FX.globalAlpha = a; FX.strokeStyle = '#ff8a3d'; FX.lineWidth = 3; FX.beginPath(); FX.moveTo(b0[0], b0[1]); FX.lineTo(b1[0], b1[1]); FX.moveTo(b0[0], b0[1]); FX.lineTo(h1[0], h1[1]); FX.stroke(); FX.restore(); }
  LP.label('≈ 75°', [0, .25, WZ + .62], -40, -90, win(t, T1 + .8, T2 - .2), 'o', 22);
  LP.label('¼ высоты', [0, 0, WZ + .38], 30, 70, win(t, T1 + 1.3, T2 - .2), 'o');
  LP.label('Резиновые упоры', [.22, .03, WZ + .75], 30, -90, win(t, T2 + 1.0, T3 - .2), 'g');
  LP.label('Сюда не встаём', [0, 2.6, WZ + .12], 50, -60, win(t, T3 + 1.0, T4 - .2), 'r');
  LP.label('Вышка-тура с перилами', [1.6, 2.4, -1.0], 0, -90, win(t, T4 + 1.0, T5 - .2), 'g');
  LP.label('Держит напарник', [0, 1.4, WZ + 1.2], 40, -60, win(t, T5 + 1.0, T6 - .2), 'g');
  LP.post(t);
  LP.freeze(t, 6.6, 7.8, '✋ СТОП');
  LP.rewind(t, 7.8, 9.1);
  LP.hook(t, 'Падение с лестницы —<br><b>самый короткий полёт в жизни</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
