<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Ремонт без договора</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script src="lp-props.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('📝', 'Смета, договор и акты —', 'за 2 минуты в Telegram'));
window.DUR = 40;
const T1 = 9.2, T2 = 13.8, T3 = 18.6, T4 = 23.4, T5 = 28, T6 = 32.4, TE = 36;
const STEPS = [[3, 'КАК БЫВАЕТ', 'ремонт «на словах»'], [T1, 'ПРОБЛЕМА', 'нечем доказать'], [T2, 'КАК НАДО', 'договор со сметой'], [T3, 'КАК НАДО', 'этапы и аванс'], [T4, 'КАК НАДО', 'акт после этапа'], [T5, 'КАК НАДО', 'переписка'], [T6, 'ЕСЛИ НЕ ПЛАТЯТ', 'претензия']];
const SUBS = [
  [3.1, 6.1, 'Сделал ремонт «на словах»,<br>без договора'],
  [6.1, T1 - .1, 'Клиент: «Переведу завтра».<br>Завтра длится <b>уже месяц</b>'],
  [T1 + .2, T2 - .1, 'Без договора и актов сложно доказать,<br><b>что</b> сделано и <b>за сколько</b>'],
  [T2 + .2, T3 - .1, 'Договор со <b>сметой</b>:<br>работы, цена, сроки'],
  [T3 + .2, T4 - .1, '<b>Аванс</b> на материалы<br>и оплата <b>по этапам</b>'],
  [T4 + .2, T5 - .1, 'Этап закончил —<br><b>акт с подписью</b> заказчика'],
  [T5 + .2, T6 - .1, 'Договорённости в мессенджере сохраняй —<br>переписка тоже <b>доказательство</b>'],
  [T6 + .2, TE - .1, 'Не платят — письменная <b>претензия</b>, дальше — суд.<br>С договором и актами шансы намного выше'],
];
const CAM = [
  [0, .3, .2, 20, 0, 2.4, -1.5], [3, .25, .14, 15, 0, 1.6, -1], [6.1, .3, .12, 11, 2.0, 1.4, 0], [T1 - .2, .32, .12, 11, 2.0, 1.4, 0],
  [T1 + .6, .2, .1, 12, 0, 1.8, -.5], [T2 - .2, .24, .1, 12, 0, 1.8, -.5], [T2 + .6, .3, .2, 6, -1.2, 1.4, 1.2], [T6 + .2, .32, .2, 6, -1.2, 1.4, 1.2],
  [T6 + .9, .3, .16, 16, 0, 2, -1], [99, .34, .16, 16, 0, 2, -1],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
const ROOMS = [-3.6, 0, 3.6];
function flat(done) {
  S.box(-5.6, 5.6, 0, .2, -4, 0, '#c9c2b4'); S.box(-5.6, 5.6, 3, 3.2, -4, 0, '#c9c2b4');
  S.box(-5.6, 5.6, .2, 3, -4.2, -4, '#e8e2d8');
  for (const x of [-5.6, -1.9, 1.7, 5.4]) S.box(x, x + .2, .2, 3, -4, 0, '#e3ddd2');
  ROOMS.forEach((cx, i) => { const k = clamp(done * 3 - i); for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) if (r * 5 + c < k * 25) S.box(cx - 1.5 + c * .6 + .02, cx - 1.5 + (c + 1) * .6 - .02, .2 + r * .55 + .02, .2 + (r + 1) * .55 - .02, -4, -3.97, ['#dbe4ff', '#e6fcf5', '#fff4e6'][i], { bias: -.2 }); });
}
window.render = function (t) {
  LP.sky.clouds = true; LP.sky.t = t; LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -12 });
  LP.ground({ x0: -16, x1: 16, zBack: -12 });
  flat(t < 6 ? clamp((t - 2.6) / 3.4) : 1);
  const good = t > T2;
  LP.person(1.2, .2, -1.5, 0, t, t < 6 ? 'stand' : 'shrug', { shirt: '#f08c3a' });
  if (!good) LP.person(lerp(3.2, 8, clamp((t - 6.6) / 2.4)), .2, -1.2, t > 6.6 ? Math.PI / 2 : -.6, t, t > 6.6 ? 'walk' : 'phone', { helmet: false, hair: '#3b2a20', shirt: '#748ffc' });
  else LP.person(-.4, .2, -1.4, .6, t, 'stand', { helmet: false, hair: '#3b2a20', shirt: '#748ffc' });
  if (good) {
    S.box(-2.2, -.6, .2, .95, -.4, .6, '#8a6440', { shadow: true });
    PROPS.papers([-1.6, .96, .1], 3, clamp((t - T2 - .3) / .8));
    if (t > T3) { const segs = 3; for (let i = 0; i < segs; i++) { const k = clamp((t - T3 - .4 - i * .7) / .5); S.box(-2.0 + i * .5, -1.6 + i * .5, 1.9, 2.05, .62, .64, k > .99 ? '#40c057' : '#ced4da', { bias: -2.5 }); } }
    if (t > T4) PROPS.papers([-1.0, .96, -.1], 2, clamp((t - T4 - .3) / .6), '#ebfbee');
    if (t > T6) PROPS.papers([-1.9, .96, -.2], 1, clamp((t - T6 - .3) / .6), '#fff5f5');
  }
  S.render();
  if (t > 5.8 && t < T2) PROPS.say('«Переведу завтра»', [3.2, 2.1, -1.2], win(t, 5.8, 7.4), -60, 'w');
  if (t > 4 && t < T1 + .4) { const d = Math.min(31, Math.round((t - 7) * 12)); if (d > 0) LP.label(`День ${d} без оплаты`, [1.2, 2.2, -1.5], 0, -120, win(t, 7.2, T2 - .2), 'r'); }
  LP.label('Объём? Цена? Сроки?', [0, 3.2, -1.5], 0, -80, win(t, T1 + .6, T2 - .2), 'r');
  LP.label('Договор + смета', [-1.6, 1.0, .1], 0, -120, win(t, T2 + .8, T3 - .2), 'g');
  LP.label('Аванс → этап 1 → этап 2', [-1.4, 2.05, .63], 0, -90, win(t, T3 + 1.0, T4 - .2), 'o', 18);
  LP.label('Акт подписан ✓', [-1.0, 1.0, -.1], 40, -100, win(t, T4 + .8, T5 - .2), 'g');
  LP.label('💬 «Согласен, плитка 45 м²»', [-.4, 1.9, -1.4], 0, -110, win(t, T5 + .6, T6 - .2), 'w', 17);
  LP.label('Претензия', [-1.9, 1.0, -.2], -30, -100, win(t, T6 + .8, TE - .2), 'r');
  LP.post(t);
  LP.hook(t, '«Договор? Мы же свои люди!» —<br><b>последние слова перед бесплатным ремонтом</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
