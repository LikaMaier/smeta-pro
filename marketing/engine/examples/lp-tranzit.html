<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Транзит через фирму и 115-ФЗ</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>

<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('🧾', 'Белая смета с актами —', 'за 2 минуты в Telegram'));
window.DUR = 40;
const T1 = 9.2, T2 = 13.8, T3 = 18.6, T4 = 23.4, T5 = 28.6, T6 = 32.6, TE = 36;
const STEPS = [[3, 'СХЕМА', '«прогнать за 5%»'], [T1, 'ЧТО БУДЕТ', 'банк и 115-ФЗ'], [T2, 'ЧТО БУДЕТ', 'красная зона'], [T3, 'ЧТО БУДЕТ', 'налоги и статья'], [T4, 'КАК НАДО', 'документы'], [T5, 'КАК НАДО', 'реальные платежи']];
const SUBS = [
  [3.1, 6.1, '«Пропусти деньги через свою фирму,<br>оставь себе <b>5%</b>»'],
  [6.1, T1 - .1, 'Пришли и в тот же день ушли дальше —<br>для банка это <b>транзит</b>'],
  [T1 + .2, T2 - .1, 'Банк по <b>115-ФЗ</b> останавливает операции<br>и просит документы'],
  [T2 + .2, T3 - .1, 'Не объяснил — блокировка и <b>«красная зона»</b><br>Банка России: откажут и другие банки'],
  [T3 + .2, T4 - .1, 'Плюс налоги со всего оборота,<br>а обнал и отмыв — <b>уголовные статьи</b>'],
  [T4 + .2, T5 - .1, 'Как надо: деньги — только за <b>реальную работу</b>.<br>Договор, смета, акты, чеки на материалы'],
  [T5 + .2, T6 - .1, 'Банк спросил — показал документы<br>и работаешь дальше'],
  [T6 + .2, TE - .1, 'Чужие 5% — как плитка на песке:<br><b>сначала ровно</b>'],
];
const CAM = [
  [0, .4, .3, 26, -.5, .6, -3], [3.0, .3, .2, 14, -7.5, .6, -2.2], [4.8, .28, .2, 14, -.2, .6, -2.2], [6.6, .28, .2, 14, 5.8, .4, -2], [T1 - .3, .3, .2, 15, 5.4, .4, -2],
  [T1 + .6, .3, .14, 10, 2.0, .9, -1.8], [T2 - .2, .34, .14, 10, 2.0, .9, -1.8], [T2 + .7, .2, .2, 12, 3.4, 2.2, -3], [T3 - .2, .24, .2, 12, 3.4, 2.2, -3],
  [T3 + .7, .3, .16, 12, 1.8, 1.0, -2], [T4 - .2, .34, .16, 12, 1.8, 1.0, -2], [T4 + .7, .3, .16, 9, -.2, .7, -1.4], [T5 - .2, .34, .16, 9, -.2, .7, -1.4],
  [T5 + .7, .36, .26, 24, 0, .4, -2.6], [99, .4, .26, 24, 0, .4, -2.6],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
const PY = -.75, PZ = -.5, MONEY = '#2f9e44';
function house(x, w, col = '#e9dfcf') { S.box(x - w / 2, x + w / 2, 0, 2.6, -5, -1.4, col, { shadow: true }); const c = LP.gable(x - w / 2, x + w / 2, -5, -1.4, 2.6, 4.1, '#8b4a3a', .25); S.poly([[x - w / 2, 2.6, -1.4], [x + w / 2, 2.6, -1.4], [x, 4.0, -1.4]], col, { center: c }); S.poly([[x - .4, 0, -1.38], [x + .4, 0, -1.38], [x + .4, 1.9, -1.38], [x - .4, 1.9, -1.38]], '#7a4a32', { two: true, bias: -.1 }); }
function office() { S.box(-2, 2, 0, 2.5, -4.2, -1.2, '#4d79a8', { alpha: .38, shadow: true, bias: -.3 }); S.box(-2.05, 2.05, 2.5, 2.7, -4.25, -1.15, '#3b5f86'); S.box(-2, 2, 0, .1, -4.2, -1.2, '#c9c2b4'); }
function tank(level, locked) { S.cyl('y', [0, 1.05, -2.6], .75, 1.9, '#adb5bd', { alpha: .45, caps: false, seg: 22, bias: -.5 }); if (level > .01) S.cyl('y', [0, .12 + level * .85, -2.6], .7, level * 1.7, MONEY, { alpha: .8, seg: 20, bias: -.45 }); S.cyl('y', [0, 2.02, -2.6], .78, .06, '#868e96', { seg: 22 }); if (locked) { S.box(-.35, .35, 1.9, 2.4, -1.75, -1.6, '#f2c230', { bias: -2 }); LP.rod([-.2, 2.4, -1.68], [-.2, 2.7, -1.68], .05, '#868e96', { bias: -2 }); LP.rod([.2, 2.4, -1.68], [.2, 2.7, -1.68], .05, '#868e96', { bias: -2 }); LP.rod([-.2, 2.7, -1.68], [.2, 2.7, -1.68], .05, '#868e96', { bias: -2 }); } }
function shed(x, label) { S.box(x - 1, x + 1, 0, 1.6, -3.4, -1.6, '#c8a26b', { shadow: true }); S.box(x - 1.05, x + 1.05, 1.6, 1.7, -3.45, -1.55, '#b08a55'); S.poly([[x - .9, .7, -1.58], [x + .9, .7, -1.58], [x + .9, 1.3, -1.58], [x - .9, 1.3, -1.58]], '#f8f9fa', { two: true, bias: -.2 }); }
function bank() { const x = 4.2, z = -9; S.box(x - 3, x + 3, 0, .4, z - 2, z + 2, '#ced4da', { shadow: true }); for (let i = 0; i < 5; i++) S.cyl('y', [x - 2.4 + i * 1.2, 1.9, z + 1.6], .18, 3, '#e9ecef', { seg: 10, shadow: true }); S.box(x - 2.8, x + 2.8, .4, 3.4, z - 1.9, z + 1.1, '#dee2e6'); S.box(x - 3.1, x + 3.1, 3.4, 3.8, z - 2.1, z + 2.1, '#ced4da'); S.poly([[x - 3.1, 3.8, z + 2.1], [x + 3.1, 3.8, z + 2.1], [x, 5, z + 2.1]], '#dee2e6', { two: true }); }
function flow(pts, t, a, col = MONEY) { if (a > .01) S.line(pts, { color: col, w: 4, dash: [10, 9], offset: -t * 50, glow: 'rgba(64,192,87,.8)', alpha: a }); }
window.render = function (t) {
  LP.sky.clouds = true; LP.sky.t = t; LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -14, houses: [[-10, -20, 6, 5, 3.4, '#ece5da', '#8d6e60'], [12, -21, 7, 6, 3.6, '#e2e7ea', '#6f6a66']] });
  LP.ground({ x0: -18, x1: 18, zBack: -14, holes: [{ x0: -8.5, x1: 8.8, y: -1.2, z0: -1.0 }] });
  house(-9.3, 4); office(); bank();
  const good = t > T4;
  const blocked = t > T1 + .8 && !good;
  // уровень в баке: в схеме — пришло и сразу ушло
  let lvl = 0; if (!good) lvl = t < 6 ? clamp((t - 3.2) / 1.2) : (blocked ? .9 : clamp(1 - (t - 6.2) / 1.2) * .9 + .9 * clamp((t - T1 + .5) / .6)); else lvl = .55;
  tank(lvl, blocked);
  if (!good) { shed(6.3); S.box(7.6, 8.6, -1.2, 0, -1.0, 0, '#111', { bias: -.4 }); } else { for (let i = 0; i < 3; i++) for (let k = 0; k < 4; k++) S.box(5.3 + i * .7, 5.9 + i * .7, k * .25, k * .25 + .22, -2.6, -2.0, '#b5583f', { shadow: true }); S.box(5.2, 7.4, 0, .1, -2.7, -1.9, '#b08a5c'); }
  // трубы
  LP.pipe([[-8, 0, -1.6], [-8, PY, PZ], [0, PY, PZ], [0, .3, -2.0]], .1, '#ced4da', { bias: -1 });
  LP.pipe([[.3, .3, -2.0], [.3, PY, PZ], [good ? 6.3 : 6.3, PY, PZ], [6.3, 0, -1.6]], .1, '#ced4da', { bias: -1 });
  if (!good) LP.pipe([[6.6, 0, -1.6], [6.6, PY, PZ], [8.1, PY, PZ]], .1, '#ced4da', { bias: -1 });
  // банковская задвижка
  const vk = t > T1 + .2 ? 1 : 0; S.cyl('y', [3.2, .2, -1.3], .06, 1.9, '#adb5bd', { seg: 8 });
  S.cyl('z', [3.2, 1.1, -1.3], .3, .06, blocked ? '#e03131' : '#40c057', { seg: 16, tf: (p) => M3.rotZ(p, [3.2, 1.1, -1.3], vk * t * 0 + (blocked ? 1.2 : 0)) });
  // светофор ЗСК
  if (t > T2 - .2 && !good) { const k = eOut((t - T2) / .6); S.box(5.0, 5.12, 0, 3.2 * k, -3.8, -3.68, '#495057'); S.box(4.75, 5.37, 3.2 * k - .1, 3.2 * k + 1.7, -3.9, -3.6, '#343a40'); ['#e03131', '#f2c230', '#40c057'].forEach((c, i) => S.cyl('z', [5.06, 3.2 * k + 1.4 - i * .55, -3.58], .2, .04, i === 0 ? c : '#5c636a', { seg: 14, emit: i === 0 })); }
  // налоговая
  if (t > T3 && !good) LP.person(lerp(8, 2.6, clamp((t - T3 - .2) / 2)), 0, -1.6, -1.2, t, t < T3 + 2.2 ? 'walk' : 'point', { helmet: false, hair: '#343a40', shirt: '#2b3a55', pants: '#2b3a55', suit: true });
  LP.person(-1.2, 0, -.9 - .3, .3, t, good ? 'stand' : (blocked ? 'up' : 'stand'), { shirt: '#f08c3a' });
  if (good) for (let i = 0; i < 4; i++) { const k = eOut((t - T4 - .4 - i * .25) / .5); if (k > .01) S.box(.9 + i * .05, 1.6 + i * .05, 1.0 + i * .03 + (1 - k) * 2, 1.03 + i * .03 + (1 - k) * 2, -1.9 - i * .1, -1.45 - i * .1, '#f8f9fa', { bias: -2.2 }); }
  // денежный поток
  if (!good) { flow([[-8, 0, -1.6], [-8, PY, PZ], [0, PY, PZ], [0, .3, -2.0]], t, win(t, 3.2, 6.4, .3, .3)); flow([[.3, .3, -2.0], [.3, PY, PZ], [6.3, PY, PZ], [6.3, 0, -1.6]], t, win(t, 5.8, T1 + .7, .3, .3)); flow([[6.6, 0, -1.6], [6.6, PY, PZ], [8.1, PY, PZ]], t, win(t, 6.4, T1 + .7, .3, .3)); }
  else { flow([[-8, 0, -1.6], [-8, PY, PZ], [0, PY, PZ], [0, .3, -2.0]], t, win(t, T4 + .3, TE, .3, .3)); flow([[.3, .3, -2.0], [.3, PY, PZ], [6.3, PY, PZ], [6.3, 0, -1.6]], t, win(t, T5 - 1, TE, .3, .3)); }
  S.render();
  LP.label('Заказчик', [-9.3, 2.6, -1.4], 0, -90, win(t, 3.2, 6.2));
  LP.label('Твоя фирма', [0, 2.7, -1.2], -50, -100, win(t, 3.6, 8.8));
  LP.label('ООО «Ромашка»', [6.3, 1.7, -1.6], 0, -100, win(t, 5.8, T1 - .2), 'o');
  LP.label('«Обнал»', [8.1, -.4, 0], -10, -150, win(t, 6.8, T1 - .2), 'r');
  LP.label('Банк · 115-ФЗ', [3.2, 1.4, -1.3], -20, -110, win(t, T1 + .4, T2 - .2), 'r');
  LP.label('Счёт заблокирован', [0, 2.6, -1.7], 70, -90, win(t, T1 + 1.4, T2 - .2), 'r');
  LP.label('ЗСК: красная зона', [5.06, 4.5, -3.6], 0, -80, win(t, T2 + 1.0, T3 - .2), 'r');
  LP.label('Налоговая', [2.6, 1.9, -1.6], 0, -90, win(t, T3 + 2.2, T4 - .2));
  LP.label('ст. 172, 174 УК РФ', [2.6, 1.0, -1.6], -60, -200, win(t, T3 + 2.8, T4 - .2), 'r');
  LP.label('Договор · смета · акты', [1.3, 1.2, -1.6], 0, -120, win(t, T4 + 1.4, T5 - .2), 'g');
  LP.label('Поставщик: кирпич', [6.3, 1.0, -2.3], 0, -100, win(t, T4 + 2, T6 - .2), 'w');
  LP.label('Реальные работы', [-1.2, 1.9, -1.2], 0, -110, win(t, T5 + .5, T6 - .2), 'g');
  LP.post(t);
  LP.hook(t, '«Прогнать деньги за 5%»:<br><b>как стройку превращают в стирку</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
