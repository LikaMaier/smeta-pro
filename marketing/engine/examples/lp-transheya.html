<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Траншея без крепления</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('⛏', 'Земляные работы без сюрпризов —', 'смета за 2 минуты в Telegram'));
window.DUR = 40;
const TC = 6.0, T1 = 9.2, T2 = 13.8, T3 = 19, T4 = 23.6, T5 = 27.8, T6 = 32.2, TE = 36;
const STEPS = [[T1, 'ПРАВИЛО 1', 'без крепления — мелко'], [T2, 'ПРАВИЛО 2', 'глубже — крепим'], [T3, 'ПРАВИЛО 3', 'отвал от бровки'], [T4, 'ПРАВИЛО 4', 'лестница'], [T5, 'ПРАВИЛО 5', 'ограждение']];
const SUBS = [
  [3.1, TC, '«Да тут два метра,<br>быстренько трубу кинем»…'],
  [7.0, 9.0, 'Кубометр грунта весит<br><b>1,5–2 тонны</b>. Обрушение — за секунду'],
  [T1 + .2, T2 - .1, 'Вертикальные стенки без крепления:<br>песок — <b>до 1 м</b>, супесь — 1,25,<br>суглинок и глина — 1,5 м'],
  [T2 + .2, T3 - .1, 'Глубже — <b>откосы или крепление</b>:<br>щиты и распорки'],
  [T3 + .2, T4 - .1, 'Отвал — <b>не ближе 0,5 м</b> от бровки.<br>Иначе он сам вернётся в траншею'],
  [T4 + .2, T5 - .1, '<b>Лестница</b> — чтобы выйти ногами,<br>а не на руках коллег'],
  [T5 + .2, T6 - .1, 'По краю — <b>ограждение</b>.<br>Под ковшом не стоим'],
  [T6 + .2, TE - .1, 'Траншея должна быть для трубы,<br>а не <b>для тебя</b>'],
];
const CAM = [
  [0, .45, .3, 13, .4, .4, -3], [3, -.06, .12, 8, .1, -.6, -1.3], [TC - .2, -.04, .1, 6.6, .1, -.9, -1.0], [9, -.04, .1, 6.6, .1, -.9, -1.0],
  [T1 + .7, .04, .06, 6.4, -.95, -1.0, -.6], [T2 - .2, .06, .06, 6.4, -.95, -1.0, -.6], [T2 + .7, -.18, .16, 7, 0, -.7, -1.6], [T3 - .2, -.14, .16, 7, 0, -.7, -1.6],
  [T3 + .7, .08, .36, 9, 1.2, -.2, -1.4], [T4 - .2, .1, .36, 9, 1.2, -.2, -1.4], [T4 + .7, -.22, .18, 6.5, -.2, -.6, -2.0], [T5 - .2, -.18, .18, 6.5, -.2, -.6, -2.0],
  [T5 + .7, .35, .32, 11, .2, 0, -2.6], [T6 - .2, .4, .32, 11, .2, 0, -2.6], [T6 + .9, -.08, .14, 8.5, .2, -.6, -1.6], [99, -.04, .14, 8.5, .2, -.6, -1.6],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
const W0 = -.5, W1 = .5, D = -2.0, ZB = -10;
function pile(x, k = 1) { S.sphere([x, 0, -3.2], 1.0, '#a77a4b', { seg: 10, rings: 5, sy: .55 * k }); S.sphere([x + .3, 0, -1.6], .8, '#9c7146', { seg: 10, rings: 5, sy: .5 * k }); }
window.render = function (t) {
  LP.sky.clouds = true; LP.sky.t = t; LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -14 });
  [[6, -8, 1.2, 1], [-6.5, -9, 1.3, 2]].forEach((q) => LP.tree(...q));
  LP.ground({ x0: -16, x1: 16, zBack: -14, holes: [{ x0: W0, x1: W1, y: D, z0: ZB }] });
  // трубы и мелочи
  S.box(-3.5, -2.3, 0, .25, -2.6, -2.2, '#d0d3d2'); LP.rod([-4, .2, -1.2], [-1.6, .2, -1.2], .09, P.pipe, { seg: 12 });
  const bad = t < T1;
  if (bad) {
    let tb = t; if (t > 8.0) tb = lerp(7.0, 4.5, ease((t - 8.0) / 1.0));
    pile(1.25);
    const k = clamp((tb - TC) / .7), kk = k * k;
    S.extrude([[W1, 0], [1.25, 0], [W1, D]].map(([x, y]) => [x - kk * .7, y - kk * .85]), -4.5, 0, P.soil, { front: P.soil, side: P.soilDark, bias: -1.2 });
    LP.person(0, D, -1.5, .1, tb, tb < TC ? 'dig' : 'up', { lean: kk * .2, roll: kk * .15 });
    if (tb > TC && tb < TC + 1) for (let i = 0; i < 18; i++) { const q = S.proj([lerp(W1, 1.2, R(i)), lerp(0, -1.5, R(i + 3)) - (tb - TC) * 1.5 * R(i + 6), -.01]); FX.fillStyle = '#8a6440'; FX.beginPath(); FX.arc(q[0], q[1], 2 + R(i) * 3, 0, 7); FX.fill(); }
  } else {
    const shore = ease((t - T2 - .3) / 2.0), mv = ease((t - T3 - .4) / 1.2), lad = eOut((t - T4 - .3) / .8), rail = ease((t - T5 - .3) / 1.2);
    pile(lerp(1.25, 2.6, mv));
    if (shore > .01) { const zz = lerp(-.02, ZB + .5, shore); for (const x of [W0, W1 - .05]) for (let z = -.1; z > zz; z -= .32) S.box(x, x + .05, D, -.05, z - .3, z, '#c49a68', { bias: -.6 }); for (const y of [-.4, -1.5]) for (const x of [W0 + .05, W1 - .12]) S.box(x, x + .07, y - .07, y + .07, zz, -.02, '#8a6440', { bias: -.7 }); for (let z = -.8; z > zz; z -= 1.6) for (const y of [-.4, -1.5]) LP.rod([W0 + .12, y, z], [W1 - .12, y, z], .04, '#e8590c', { seg: 6, bias: -.8 }); }
    if (lad > .01) { const y0 = lerp(1.5, 0, lad); for (const dz of [-.22, .22]) LP.rod([-.3, D + y0, -2.4 + dz], [-.05, 1.0 + y0, -2.4 + dz], .025, '#adb5bd', { seg: 5, bias: -.9 }); for (let i = 1; i < 10; i++) { const k = i / 10; LP.rod([lerp(-.3, -.05, k), lerp(D, 1, k) + y0, -2.62], [lerp(-.3, -.05, k), lerp(D, 1, k) + y0, -2.18], .018, '#adb5bd', { seg: 4, bias: -.9 }); } }
    if (rail > .01) { const z1 = lerp(-.2, ZB + 2, rail); for (const x of [W0 - .5, W1 + .5]) { for (let z = -.3; z > z1; z -= 1.5) S.box(x - .03, x + .03, 0, 1.1, z - .03, z + .03, '#e9ecef', { shadow: true }); for (let z = -.3; z > z1; z -= .5) S.box(x - .02, x + .02, .95, 1.05, z - .25, z, Math.round(z * 2) % 2 ? '#e03131' : '#f8f9fa'); } }
    const ps = t > T6 ? 'stand' : 'dig';
    LP.person(0, D, -1.5, .1, t, ps, {});
    if (t > T6) LP.rod([0, D + .15, -.2], [0, D + .15, -5], .11, P.pipe, { seg: 12, bias: -.4 });
  }
  S.render();
  // шкала глубин
  if (t > T1 + .3 && t < T2) { const a = win(t, T1 + .3, T2 - .1); FX.save(); FX.globalAlpha = a; FX.strokeStyle = '#fff'; FX.lineWidth = 3; const q0 = S.proj([W0 - .25, 0, .01]), q1 = S.proj([W0 - .25, D, .01]); FX.beginPath(); FX.moveTo(q0[0], q0[1]); FX.lineTo(q1[0], q1[1]); FX.stroke(); FX.restore(); }
  LP.label('песок 1 м', [W0 - .25, -1.0, .01], -95, 0, win(t, T1 + .6, T2 - .2), 'w', 17);
  LP.label('супесь 1,25 м', [W0 - .25, -1.25, .01], -110, 40, win(t, T1 + .9, T2 - .2), 'w', 17);
  LP.label('суглинок, глина 1,5 м', [W0 - .25, -1.5, .01], -120, 85, win(t, T1 + 1.2, T2 - .2), 'w', 17);
  LP.label('2 м — нужно крепление', [W1, -1.0, .01], 40, -170, win(t, T1 + 1.8, T2 - .2), 'r');
  LP.label('Щиты', [W1 - .02, -1, -1.2], 60, -120, win(t, T2 + 1.4, T3 - .2));
  LP.label('Распорки', [0, -.4, -.8], -40, -150, win(t, T2 + 2.0, T3 - .2), 'o');
  LP.label('≥ 0,5 м', [(W1 + 1.6) / 2, .05, -1.6], 0, -110, win(t, T3 + 1.6, T4 - .2), 'o', 22);
  LP.label('Лестница', [-.2, 0, -2.4], -60, -110, win(t, T4 + 1.0, T5 - .2));
  LP.label('Ограждение', [W1 + .5, 1.0, -1.8], 40, -90, win(t, T5 + 1.2, T6 - .2), 'g');
  if (t > T3 + 1.4 && t < T4) { const a = win(t, T3 + 1.4, T4 - .1), q0 = S.proj([W1, .05, -1.6]), q1 = S.proj([1.6, .05, -1.6]); FX.save(); FX.globalAlpha = a; FX.strokeStyle = '#ff8a3d'; FX.lineWidth = 3; FX.beginPath(); FX.moveTo(q0[0], q0[1]); FX.lineTo(q1[0], q1[1]); FX.stroke(); FX.restore(); }
  LP.post(t);
  LP.freeze(t, 6.8, 8.0, '✋ СТОП');
  LP.rewind(t, 8.0, 9.1);
  LP.hook(t, 'Траншея 2 метра:<br><b>как не стать частью коммуникаций</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
