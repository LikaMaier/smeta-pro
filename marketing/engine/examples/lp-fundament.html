<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Ленточный фундамент</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('🏗', 'Фундамент под ключ —', 'смета за 2 минуты в Telegram'));
window.DUR = 40;
const T1 = 3.2, T2 = 8.2, T3 = 13.2, T4 = 18.2, T5 = 23.2, T6 = 28.4, T7 = 32.6, TE = 36;
const STEPS = [[T1, 'ШАГ 1', 'Разметка'], [T2, 'ШАГ 2', 'Траншея'], [T3, 'ШАГ 3', 'Песчаная подушка'], [T4, 'ШАГ 4', 'Опалубка'], [T5, 'ШАГ 5', 'Арматура'], [T6, 'ШАГ 6', 'Бетон'], [T7, 'ШАГ 7', 'Набор прочности']];
const SUBS = [
  [T1 + .2, T2 - .1, 'Обноска и шнуры по осям.<br><b>Диагонали равны</b> — значит, углы 90°'],
  [T2 + .2, T3 - .1, 'Траншея под ленту — <b>по проекту</b>,<br>обычно 0,7–1 м'],
  [T3 + .2, T4 - .1, 'Песок <b>20–30 см</b> — слоями,<br>с проливкой и трамбовкой'],
  [T4 + .2, T5 - .1, 'Опалубка — <b>на 30–40 см</b> выше земли,<br>с распорками, чтобы не разорвало'],
  [T5 + .2, T6 - .1, 'Каркас: <b>2 пояса Ø12</b>, хомуты Ø8<br>через 40 см, от опалубки — 5 см'],
  [T6 + .2, T7 - .1, 'Бетон <b>М300</b> — за один день,<br>без перерывов, с вибратором'],
  [T7 + .2, TE - .1, 'Опалубку снимаем через <b>7–10 дней</b>,<br>строить — после <b>28 дней</b>'],
];
const XL = [-3.3, -2.7], XR = [2.7, 3.3], ZB = -6.4;
const CAM = [
  [0, .42, .17, 9.5, -.6, -.1, -2.4], [T1, .4, .17, 9.5, -.6, -.1, -2.4], [T2 - .2, .36, .17, 9.5, -.8, -.1, -2.3],
  [T2 + .8, .3, .16, 7, -2.2, -.4, -1.3], [T3 - .2, .3, .16, 7, -2.3, -.5, -1.3], [T3 + .6, .2, .1, 6, -2.7, -.6, -.9], [T4 - .2, .24, .1, 6, -2.7, -.6, -.9],
  [T4 + .7, .45, .18, 6.4, -2.6, -.2, -1.2], [T5 - .2, .45, .18, 6.4, -2.6, -.2, -1.2], [T5 + .7, .2, .12, 4.4, -3, -.2, -.6], [T6 - .2, .26, .12, 4.4, -3, -.2, -.6],
  [T6 + .8, .12, .1, 5.6, -2.7, -.3, -.8], [T7 - .2, .17, .1, 5.6, -2.6, -.3, -.8], [T7 + 1, .36, .22, 11, 0, .3, -2.4], [TE, .42, .22, 11, 0, .3, -2.4], [99, .42, .22, 11, 0, .3, -2.4],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
const strip = (f) => [XL, XR].forEach(f);
window.render = function (t) {
  LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -11 });
  [[7.5, -7, 1.1, 2], [-8, -6, 1.2, 0], [-6, -9.5, .95, 3]].forEach((q) => LP.tree(...q));
  const dig = ease((t - T2 - .2) / 3.6);
  LP.ground({ x0: -14, x1: 14, zBack: -11, holes: dig > .01 ? [{ x0: XL[0], x1: XL[1], y: -1.05 * dig, z0: ZB }, { x0: XR[0], x1: XR[1], y: -1.05 * dig, z0: ZB }] : [] });
  // материалы на участке
  for (let i = 0; i < 4; i++) S.box(.4, 1.6, .12 + i * .25, .35 + i * .25, -4.2, -3.2, '#e9e5dc', { shadow: true, front: '#dfdbd1' });
  S.box(.35, 1.65, 0, .12, -4.25, -3.15, '#b08a5c', { shadow: true });
  if (t < T5 + .3) for (let i = 0; i < 6; i++) LP.rod([-1.6, .06 + (i % 3) * .05, -1.6 - (i >> 1) * .05], [1.4, .06 + (i % 3) * .05, -1.75 - (i >> 1) * .05], .025, '#8a4f34', { seg: 5, flat: true, shadow: true });
  // обноска и шнуры
  const ob = t < T5 + .5 ? 1 : clamp(1 - (t - T5 - .5) / .6);
  if (ob > .01 && t > T1 - .3) {
    const up = eOut((t - T1) / .8);
    for (const x of [-4.3, 4.3]) S.box(x - .05, x + .05, 0, .7 * up, ZB - .45, ZB - .35, '#a07a50', { shadow: true });
    S.box(-4.5, 4.5, .45 * up, .6 * up, ZB - .5, ZB - .45, '#c49a68');
    if (up > .9) {
      const sa = win(t, T1 + .9, T5 + 1, .4, .4);
      for (const x of [...XL, ...XR]) S.line([[x, .55, ZB - .45], [x, .55, -.02]], { color: '#ffffff', w: 1.4, alpha: sa });
      const da = win(t, T1 + 2.2, T2, .4, .3);
      if (da > .01) { S.line([[XL[0], .56, -.02], [XR[1], .56, ZB - .45]], { color: '#ff8a3d', w: 2.2, dash: [7, 6], alpha: da }); S.line([[XR[1], .56, -.02], [XL[0], .56, ZB - .45]], { color: '#ff8a3d', w: 2.2, dash: [7, 6], alpha: da }); }
    }
  }
  // землекоп и отвал
  if (t > T1 + .5 && t < T3) LP.person(-4.3, 0, lerp(-2.5, -4.5, dig), 1.2, t, dig > 0 && dig < 1 ? 'dig' : 'stand');
  if (dig > .01 && t < T7) S.sphere([-5.4, 0, -3.5], 1.2 * Math.sqrt(dig) + .1, '#a77a4b', { seg: 9, rings: 5, sy: .35 / (1.2 * Math.sqrt(dig) + .1) });
  // песок слоями
  const sand = ease((t - T3 - .2) / 3.2);
  strip(([a, b]) => { if (sand > .01) { S.box(a, b, -1.05, -1.05 + .3 * sand, ZB, 0, P.sand, { bias: -.3 }); for (let k = 1; k < 3; k++) if (sand > k / 3) S.box(a, b, -1.05 + .1 * k - .004, -1.05 + .1 * k + .004, ZB, .002, '#cdb47c', { bias: -.35 }); } });
  if (t > T3 + .4 && t < T4 - .3) { const z = -.6 - ((t - T3) * 1.2 % 5); S.box(-3.22, -2.78, -1.05 + .3 * sand, -1.05 + .3 * sand + .12, z - .25, z + .25, '#f2a33a', { bias: -.6 }); S.box(-3.02, -2.98, -1.05 + .3 * sand + .12, -1.05 + .3 * sand + .9, z + .2, z + .25, '#555', { bias: -.6 }); }
  // опалубка
  const fw = ease((t - T4 - .2) / 1.4), off = t > T7 + .6 ? clamp((t - T7 - .6) / .8) : 0;
  if (fw > .01 && off < 1) strip(([a, b]) => {
    const top = lerp(-.75, .4, fw), al = 1 - off;
    S.box(a + .05, a + .1, -.75, top, ZB, 0, '#d6b27a', { alpha: al, bias: -.5 }); S.box(b - .1, b - .05, -.75, top, ZB, 0, '#d6b27a', { alpha: al, bias: -.5 });
    if (fw > .99) for (let z = -.4; z > ZB; z -= 1.2) { S.box(a + .1, b - .1, .36, .4, z - .03, z + .03, '#8c6a46', { alpha: al, bias: -.55 }); LP.rod([a + .05, .25, z], [a - .45, 0, z], .025, '#8c6a46', { seg: 4, alpha: al, flat: true }); LP.rod([b - .05, .25, z], [b + .45, 0, z], .025, '#8c6a46', { seg: 4, alpha: al, flat: true }); }
  });
  // арматура
  const rb = ease((t - T5 - .2) / 2.2), conc = ease((t - T6 - .2) / 3);
  if (rb > .01) strip(([a, b]) => {
    const xs = [a + .2, b - .2], ys = [-.65, .3], zEnd = lerp(ZB + .1, -.05, rb);
    if (conc < .99) {
      for (const x of xs) for (const y of ys) LP.rod([x, y, ZB + .1], [x, y, zEnd], .016, '#8a4f34', { seg: 5, flat: true, bias: -.7 });
      for (let z = -.2; z > ZB + .1; z -= .4) if (z > zEnd - .01 || true) { if (-z > -zEnd + 6) continue; if (z < zEnd - 6.5) continue; if (z > zEnd) continue; const c = [[xs[0], ys[0]], [xs[1], ys[0]], [xs[1], ys[1]], [xs[0], ys[1]], [xs[0], ys[0]]]; for (let i = 0; i < 4; i++) LP.rod([c[i][0], c[i][1], z], [c[i + 1][0], c[i + 1][1], z], .01, '#9a5a3c', { seg: 4, flat: true, caps: false, bias: -.72 }); }
    }
    if (conc > .01) for (const x of xs) for (const y of ys) if (y < lerp(-.75, .4, conc)) S.poly([[x - .025, y - .025, .004], [x + .025, y - .025, .004], [x + .025, y + .025, .004], [x - .025, y + .025, .004]], '#5a3424', { two: true, bias: -1.2 });
  });
  // бетон
  if (conc > .01) strip(([a, b]) => S.box(a + .1, b - .1, -.75, lerp(-.75, .4, conc), ZB, 0, '#b3b6b6', { front: '#a9acac', bias: -.4 }));
  if (t > T6 + .2 && t < T7 - .4) { const ch = S.proj([-3, .4, -1.5]); const ty = lerp(-.75, .4, conc); LP.rod([-3.0, 2.2, -2.8], [-3.0, .9, -1.8], .12, '#e2833a', { seg: 8, bias: -2 }); S.line([[-3.0, .9, -1.8], [-3.0, ty, -1.5]], { color: '#9fa3a3', w: 7, alpha: .95 }); void ch; }
  // финал: стена из блоков начинается
  if (t > T7 + 1.6) { const k = ease((t - T7 - 1.6) / 1.4); strip(([a, b]) => { for (let i = 0; i < 3; i++) if (k > i / 3) S.box(a + .1, b - .1, .4 + i * .3, .4 + (i + 1) * .3 - .02, ZB, 0, '#e9e5dc', { front: '#dfdbd1', bias: -.45 }); }); }
  S.render();
  LP.label('Шнуры по осям', [XL[1], .56, -3], 40, -140, win(t, T1 + 1, T2 - .2));
  LP.label('Диагонали равны', [0, .56, -3.2], 0, -90, win(t, T1 + 2.4, T2 - .2), 'o');
  LP.label('0,7–1 м', [XL[0] - .02, -.5, -.02], -50, -120, win(t, T2 + 2.6, T3 - .2));
  LP.label('Песок 20–30 см', [-3, -.85, -.02], 50, -160, win(t, T3 + 1.6, T4 - .2));
  LP.label('+30–40 см', [XL[0] + .07, .38, -.02], -40, -110, win(t, T4 + 1.4, T5 - .2));
  LP.label('Ø12 · 2 пояса', [XL[0] + .2, .3, -.3], -20, -120, win(t, T5 + 1.6, T6 - .2));
  LP.label('Хомут Ø8 / 40 см', [XL[1] - .2, -.2, -.6], 70, -60, win(t, T5 + 2.2, T6 - .2));
  LP.label('5 см', [XL[0] + .15, -.1, -.02], -60, 70, win(t, T5 + 2.8, T6 - .2), 'o');
  LP.label('Бетон М300', [XL[0] + .3, 0, -.02], -10, -150, win(t, T6 + 2.2, T7 - .2));
  LP.label('28 дней', [XR[0] + .3, .4, -.02], 0, -110, win(t, T7 + 1, TE - .2), 'g');
  LP.post(t);
  LP.hook(t, 'Ленточный фундамент<br><b>за 40 секунд</b>', T1);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
