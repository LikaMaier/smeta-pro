<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Катушка-удлинитель</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script src="lp-props.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('🔌', 'Электрика на стройке —', 'смета за 2 минуты в Telegram'));
window.DUR = 40;
const TB = 5.4, T1 = 9.2, T2 = 13.8, T3 = 18.4, T4 = 23, T5 = 27.6, T6 = 32.2, TE = 36;
const STEPS = [[T1, 'ПРАВИЛО 1', 'размотай полностью'], [T2, 'ПРАВИЛО 2', 'сечение под нагрузку'], [T3, 'ПРАВИЛО 3', 'не в лужу'], [T4, 'ПРАВИЛО 4', 'УЗО на вводе'], [T5, 'ПРАВИЛО 5', 'целый кабель']];
const SUBS = [
  [3.1, TB, '«Всё в одну катушку —<br>и бетономешалку, и болгарку»…'],
  [6.8, 9.0, 'Смотанный кабель не остывает:<br>изоляция <b>плавится</b> — и до пожара недалеко'],
  [T1 + .2, T2 - .1, 'На катушке пишут два предела: <b>смотанная</b><br>держит примерно в 3–4 раза меньше'],
  [T2 + .2, T3 - .1, 'Кабель — <b>под нагрузку</b>:<br>3×1,5 мм² — до 16 А, мощному — 3×2,5'],
  [T3 + .2, T4 - .1, 'Провод — <b>не в лужу</b> и не под колёса:<br>поднимаем на крючки'],
  [T4 + .2, T5 - .1, 'На вводе — <b>УЗО</b> и заземление.<br>Катушка — с заземляющим контактом'],
  [T5 + .2, T6 - .1, 'Повреждённый кабель — <b>заменить</b>,<br>а не замотать изолентой «на годик»'],
  [T6 + .2, TE - .1, 'Катушка на стройке —<br><b>не обогреватель</b> 🔥'],
];
const CAM = [
  [0, .55, .3, 9, 1.3, .5, -1.3], [3, .45, .24, 5.5, .7, .4, -1.2], [TB, .4, .22, 3.6, .2, .4, -1.1], [9, .4, .22, 3.6, .2, .4, -1.1],
  [T1 + .6, .3, .22, 3.4, .1, .45, -1.0], [T2 - .2, .34, .22, 3.4, .1, .45, -1.0], [T2 + .6, .2, .14, 2.4, .5, .3, -.9], [T3 - .2, .24, .14, 2.4, .5, .3, -.9],
  [T3 + .6, .5, .34, 7, 1.4, .4, -1.2], [T4 - .2, .54, .34, 7, 1.4, .4, -1.2], [T4 + .6, -.4, .1, 4.2, -2.4, 1.2, -1.2], [T5 - .2, -.36, .1, 4.2, -2.4, 1.2, -1.2],
  [T5 + .6, .3, .3, 3.2, 1.5, .2, -1.1], [T6 - .2, .34, .3, 3.2, 1.5, .2, -1.1], [T6 + .8, .5, .3, 10, 1.2, .5, -1.3], [99, .55, .3, 10, 1.2, .5, -1.3],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
function mixer(x, z, t, on) {
  const c = [x, .95, z]; S.box(x - .5, x + .5, 0, .08, z - .35, z + .35, '#495057', { shadow: true });
  LP.rod([x - .4, .08, z], [x - .1, .95, z], .04, '#e8590c', { seg: 6 }); LP.rod([x + .4, .08, z], [x + .1, .95, z], .04, '#e8590c', { seg: 6 });
  S.cyl('x', c, .42, .7, '#e8590c', { r2: .25, seg: 18, shadow: true, tf: (p) => M3.rotY(M3.rotZ(p, c, .5), c, on ? t * 2 : 0) });
}
window.render = function (t) {
  LP.sky.clouds = true; LP.sky.t = t; LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -9 });
  [[5, -6, 1.1, 1], [-5, -7, 1.2, 2]].forEach((q) => LP.tree(...q));
  LP.ground({ x0: -12, x1: 12, zBack: -9 });
  S.poly([[.9, .012, -1.5], [2.0, .012, -1.6], [2.2, .012, -.8], [1.0, .012, -.7]], '#6fb1db', { two: true, ground: true, alpha: .85 });
  // щиток с УЗО
  S.box(-2.6, -2.2, 0, 1.6, -1.4, -1.3, '#868e96', { shadow: true }); S.box(-2.65, -2.15, 1.0, 1.6, -1.3, -1.15, '#dee2e6');
  for (let i = 0; i < 3; i++) S.box(-2.6 + i * .14, -2.5 + i * .14, 1.25, 1.4, -1.15, -1.13, i === 0 ? '#4dabf7' : '#343a40');
  const bad = t < T1; let tb = t; if (bad && t > 7.8) tb = lerp(6.6, 4.0, ease((t - 7.8) / 1.2));
  const unw = bad ? 0 : ease((t - T1 - .3) / 1.6);
  const hot = bad ? clamp((tb - 3.6) / 2.2) : 0;
  PROPS.reel([0, .32, -1.2], unw, hot);
  mixer(2.8, -2.0, t, true);
  S.box(2.8, 3.6, 0, .9, -.9, -.3, '#8a6440', { shadow: true });
  // кабели
  const route = t > T3 + .4 && !bad ? [[0, .35, -.8], [.6, .5, -.9], [1.5, .7, -1.2], [2.2, .7, -1.5], [2.6, .5, -1.9]] : [[0, .35, -.8], [.8, .02, -1.0], [1.5, .02, -1.2], [2.2, .02, -1.5], [2.6, .4, -1.9]];
  S.line(route, { color: '#212529', w: 3.5 });
  S.line([[0, .35, -.8], [1.2, .02, -.4], [3.1, .9, -.6]], { color: '#212529', w: 3 });
  if (t > T3 + .4 && !bad) for (const p of route.slice(1, 4)) S.box(p[0] - .02, p[0] + .02, 0, p[1], p[2] - .02, p[2] + .02, '#8a6440');
  if (t > T4) S.line([[-2.4, 1.0, -1.15], [-1.2, .02, -1.0], [0, .32, -1.2]], { color: '#212529', w: 3.5 });
  LP.person(3.4, 0, -.4, -.6, t, 'stand', {});
  S.render();
  if (hot > .05 && bad) { const q = S.proj([0, .32, -1.0]); const g = FX.createRadialGradient(q[0], q[1], 0, q[0], q[1], 90); g.addColorStop(0, `rgba(255,90,30,${.6 * hot})`); g.addColorStop(1, 'rgba(255,90,30,0)'); FX.fillStyle = g; FX.fillRect(q[0] - 90, q[1] - 90, 180, 180); }
  if (hot > .3 && bad) { const q = S.proj([0, .6, -1.0]); FX.save(); for (let i = 0; i < 8; i++) { const ph = (tb * .7 + R(i)) % 1, r = 12 + ph * 40; FX.globalAlpha = (1 - ph) * .5 * hot; FX.fillStyle = '#495057'; FX.beginPath(); FX.arc(q[0] + Math.sin(i + tb) * 12, q[1] - ph * 120, r, 0, 7); FX.fill(); } FX.restore(); }
  LP.label('🔥 3 кВт на смотанной', [0, .65, -1.05], 0, -110, win(t, 4.0, T1 - .2), 'r');
  LP.label('Смотанная ~1 кВт', [0, .65, -1.05], -70, -150, win(t, T1 + 1.0, T2 - .2), 'r', 18);
  LP.label('Размотанная — до 3,5–4 кВт', [0, .65, -1.05], 40, -90, win(t, T1 + 1.6, T2 - .2), 'g', 18);
  LP.label('3×1,5 мм² · 16 А', [.8, .02, -1.0], 0, -110, win(t, T2 + 1.0, T3 - .2), 'o', 20);
  LP.label('Над лужей — на крючках', [1.5, .7, -1.2], 0, -110, win(t, T3 + 1.4, T4 - .2), 'g');
  LP.label('УЗО 30 мА', [-2.6, 1.32, -1.13], 50, -80, win(t, T4 + 1.0, T5 - .2), 'o', 21);
  LP.label('Изолента ≠ ремонт', [1.5, .02, -1.2], 0, -100, win(t, T5 + 1.0, T6 - .2), 'r');
  LP.post(t);
  LP.freeze(t, 6.6, 7.8, '✋ СТОП');
  LP.rewind(t, 7.8, 9.1);
  LP.hook(t, 'Катушка-удлинитель:<br><b>самый дешёвый обогреватель на стройке</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
