// ---------------- подписи ----------------
const SCREENS = [['4form', 'Поменял размеры —<br>итог пересчитан <span class="y">сам</span>', 193, 274], ['5result', '«А подешевле?»<br>Жмёшь <span class="y">Эконом</span>', 110, 442], ['6eco', 'Материалы подешевле —<br>смета <span class="y">уже пересчитана</span>', 0, 0], ['8est', 'Новый PDF —<br>заказчику', 73, 143]];
const SYL = ['ПЕ-', 'РЕ-', 'СЧИ-', 'ТАТЬ…'];

function caption(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } el.style.opacity = html ? 1 : 0; }

window.render = function (t) {
  const win = clamp((t - T.win[0]) / 1.4), cure = ease(clamp((t - T.win[0] - .2) / 1.2));
  // камера: медленный наезд, тряска на «пересчитать»

  $('fog1').setAttribute('opacity', .5 * (1 - cure * .7)); $('fog2').setAttribute('opacity', .45 * (1 - cure));

  document.querySelectorAll('.bird').forEach((bd) => { const i = +bd.dataset.i; bd.setAttribute('transform', `translate(${(t - T.win[0]) * (40 + i * 8) + 60 + i * 50},${260 + i * 26 + Math.sin(t * 3 + i) * 8}) scale(${1 + Math.sin(t * 14 + i) * .25},1)`); });

  const skin = mix('9cc48a', 'f2c29b', cure), skinD = mix('7da36c', 'e0a982', cure);
  [G.face, G.neck, ...G.ears].forEach((e) => e.setAttribute('fill', skin));

    const sw = Math.sin(t * 2.6 + s) * 8 * z;
    const zx = s * 104, zy = -286 + sw;              // руки вперёд (зомби)
    const hx = s < 0 ? -84 : 60, hy = s < 0 ? -150 : -300; // человек: левая вниз, правая с телефоном
