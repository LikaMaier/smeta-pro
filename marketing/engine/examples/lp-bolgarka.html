<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Болгарка без кожуха</title></head><body><div id="stage">
<canvas id="cv"></canvas>
<canvas id="fx" width="1080" height="1920" style="width:540px;height:960px"></canvas>
<div id="chip"></div><div id="hook" class="cap"></div><div id="sub" class="cap"></div><div id="fade"></div>
</div>
<script src="drain-common.js"></script>
<script src="mini3d.js"></script>
<script src="pfx.js"></script>
<script src="lp.js"></script>
<script src="lp-props.js"></script>
<script>
$('stage').insertAdjacentHTML('beforeend', END_HTML('🦺', 'Стройка без травм —', 'смета за 2 минуты в Telegram'));
window.DUR = 40;
const TB = 5.6, T1 = 9.2, T2 = 13.6, T3 = 18.2, T4 = 23, T5 = 27.6, T6 = 32.2, TE = 36;
const STEPS = [[T1, 'ПРАВИЛО 1', 'кожух на месте'], [T2, 'ПРАВИЛО 2', 'диск по размеру'], [T3, 'ПРАВИЛО 3', 'очки и наушники'], [T4, 'ПРАВИЛО 4', 'две руки'], [T5, 'ПРАВИЛО 5', 'дождись остановки']];
const SUBS = [
  [3.1, TB, '«Кожух мешает,<br>поставлю круг побольше»…'],
  [6.8, 9.0, 'Диск 230 на маленькой болгарке<br>крутится <b>быстрее, чем рассчитан</b>'],
  [T1 + .2, T2 - .1, 'Кожух не снимаем: при заедании<br>он принимает <b>основной удар</b>'],
  [T2 + .2, T3 - .1, 'Диск — не больше, чем позволяет кожух,<br>и рассчитан на <b>обороты болгарки</b>'],
  [T3 + .2, T4 - .1, '<b>Очки или щиток</b>, наушники<br>и плотные перчатки'],
  [T4 + .2, T5 - .1, 'Держим <b>двумя руками</b>,<br>устойчиво, деталь закреплена'],
  [T5 + .2, T6 - .1, 'Выключил — <b>дождись остановки диска</b>,<br>потом клади'],
  [T6 + .2, TE - .1, 'Пальцев — 10.<br>Дисков в магазине — <b>сколько угодно</b>'],
];
const CAM = [
  [0, .5, .2, 7, .5, 1.1, 0], [3, .25, .12, 3.6, .55, 1.15, 0], [TB, .2, .1, 3.0, .7, 1.15, 0], [9, .2, .1, 3.0, .7, 1.15, 0],
  [T1 + .6, .15, .06, 2.0, .8, 1.18, .05], [T2 - .2, .2, .06, 2.0, .8, 1.18, .05], [T2 + .6, .1, .04, 1.6, .82, 1.18, .07], [T3 - .2, .14, .04, 1.6, .82, 1.18, .07],
  [T3 + .6, -.5, .08, 2.2, .1, 1.5, 0], [T4 - .2, -.45, .08, 2.2, .1, 1.5, 0], [T4 + .6, .45, .14, 4.2, .4, 1.1, 0], [T5 - .2, .5, .14, 4.2, .4, 1.1, 0],
  [T5 + .6, .2, .06, 2.0, .8, 1.15, .05], [T6 - .2, .24, .06, 2.0, .8, 1.15, .05], [T6 + .8, .55, .2, 7, .5, 1.1, 0], [99, .6, .2, 7, .5, 1.1, 0],
];
const S = LP.init(), P = LP.P, FX = LP.FX;
window.render = function (t) {
  LP.sky.clouds = true; LP.sky.t = t; LP.sky(); LP.cam(CAM, t);
  LP.backdrop({ fenceZ: -8 });
  [[4, -6, 1.1, 1], [-4, -7, 1.2, 2]].forEach((q) => LP.tree(...q));
  LP.ground({ x0: -12, x1: 12, zBack: -8 });
  S.box(.55, 1.7, 0, 1.0, -.45, .45, '#8a6440', { top: '#a17a52', shadow: true });
  LP.rod([.6, 1.08, -.4], [1.65, 1.08, .4].map((v, i) => i === 2 ? -.4 : v), .05, '#6c757d', { seg: 10 });
  S.box(1.2, 1.3, 1.0, 1.15, -.42, -.3, '#495057');
  const bad = t < T1; let tb = t; if (bad && t > 7.8) tb = lerp(6.6, 4.0, ease((t - 7.8) / 1.2));
  const boom = bad && tb > TB;
  const ppe = !bad && t > T3 + .3;
  const pose = t > T6 ? 'stand' : 'pull';
  LP.person(0, 0, 0, Math.PI / 2, t, pose, { helmet: !bad || true, lean: bad && boom ? -.12 : 0 });
  if (ppe) { S.box(.12, .16, 1.58, 1.68, -.12, .12, '#74c0fc', { alpha: .7, bias: -1 }); for (const z of [-.15, .15]) S.sphere([0, 1.65, z], .06, '#e03131', { seg: 8, rings: 5 }); }
  const spinV = bad ? 1 : (t > T5 + .3 && t < T6 ? Math.max(0, 1 - (t - T5 - .3) / 3) : 1);
  if (t < T6 + .2) { const c = PROPS.grinder([.45, 1.2, 0], t, { guard: !bad && t > T1 + .5, rD: bad ? .115 : .0625, spin: t * 40 * spinV, discCol: boom ? '#e03131' : '#868e96' }); if (spinV > .05 && !boom) { const q = S.proj(c); FX.save(); FX.globalAlpha = .5 * spinV; FX.strokeStyle = '#dee2e6'; FX.lineWidth = 1; FX.beginPath(); FX.arc(q[0], q[1], 6, t * 30, t * 30 + 4); FX.stroke(); FX.restore(); } }
  S.render();
  if (boom && tb < 7.0) { const q = S.proj([.81, 1.18, .07]); FX.save(); for (let i = 0; i < 14; i++) { const a = R(i) * 6.28, d = (tb - TB) * (160 + R(i + 4) * 160); FX.fillStyle = '#495057'; FX.beginPath(); const x = q[0] + Math.cos(a) * d, y = q[1] + Math.sin(a) * d; FX.moveTo(x, y); FX.lineTo(x + 9, y + 3); FX.lineTo(x + 2, y + 10); FX.fill(); } FX.restore(); }
  if (!bad && t < T6) { const q = S.proj([.81, 1.1, .07]); FX.save(); FX.globalCompositeOperation = 'lighter'; for (let i = 0; i < 16; i++) { const a = -2.4 + R(i + Math.floor(t * 20)) * .9, l = 10 + R(i + 3) * 40; FX.strokeStyle = 'rgba(255,190,90,.9)'; FX.lineWidth = 1.6; FX.beginPath(); FX.moveTo(q[0], q[1]); FX.lineTo(q[0] + Math.cos(a) * l, q[1] - Math.sin(a) * l * .4 + l * .5); FX.stroke(); } FX.restore(); }
  LP.label('Кожух', [.83, 1.27, .07], 30, -90, win(t, T1 + 1.0, T2 - .2), 'g');
  LP.label('Ø 125 мм', [.81, 1.18, .07], -60, -110, win(t, T2 + .8, T3 - .2), 'o', 21);
  LP.label('макс. обороты на диске ≥ болгарки', [.81, 1.12, .07], 0, 100, win(t, T2 + 1.6, T3 - .2), 'w', 16);
  LP.label('Очки', [.14, 1.64, 0], 40, -80, win(t, T3 + 1.0, T4 - .2), 'g');
  LP.label('Наушники', [0, 1.65, .16], -50, -120, win(t, T3 + 1.6, T4 - .2));
  LP.label('Две руки', [.45, 1.2, 0], -40, 110, win(t, T4 + 1.0, T5 - .2), 'g');
  LP.label('Ещё крутится!', [.81, 1.18, .07], 0, -100, win(t, T5 + .8, T5 + 3.0), 'r');
  LP.label('Стоп — можно класть', [.81, 1.18, .07], 0, -100, win(t, T5 + 3.2, T6 - .2), 'g');
  LP.post(t);
  LP.freeze(t, 6.6, 7.8, '✋ СТОП');
  LP.rewind(t, 7.8, 9.1);
  LP.hook(t, 'Болгарка без кожуха —<br><b>самый быстрый способ сменить профессию</b>', 3.0);
  LP.chip(t, STEPS, TE - .1);
  renderSubs(t, SUBS);
  renderEnd(t, TE);
};
document.fonts.ready.then(() => { window.render(0); window.OK = true; });
</script>
</body></html>
